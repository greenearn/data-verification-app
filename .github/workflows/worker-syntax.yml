name: Worker syntax check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker JavaScript syntax
        run: node --check worker.js
      - name: Check inline frontend JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\\b(?![^>]*\\bsrc=)[^>]*>([\\s\\S]*?)<\\/script>/gi)];
          if (!scripts.length) throw new Error('No inline frontend script found');
          scripts.forEach((match, index) => new Function(match[1]));
          console.log('Validated ' + scripts.length + ' inline script(s).');
          NODE
