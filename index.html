<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Data Verification</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#07111d;--panel:#102338;--line:rgba(151,181,207,.16);--text:#edf6fb;--muted:#91a8ba;--mint:#54e0c1;--red:#ff8791}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,#081522,#07111d);color:var(--text);font:14px/1.5 system-ui,sans-serif}
button,input,select,textarea{font:inherit}
.wrap{max-width:900px;margin:auto;padding:20px 14px 45px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0 18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#153c43;color:var(--mint);font-weight:900}
.brand strong{font-size:12px;letter-spacing:.12em}
.brand small{display:block;color:var(--muted);font-size:10px}
.status,.pill{font-size:10px;border:1px solid rgba(84,224,193,.25);border-radius:30px;padding:5px 9px;color:var(--mint)}
h1{font-size:27px;line-height:1.2;margin:25px 0 6px}
h2{font-size:16px;margin:0}
h3{font-size:13px;margin:0 0 7px}
p{color:var(--muted);font-size:12px;margin:5px 0}
.nav{display:flex;gap:8px;overflow-x:auto;padding:13px 0}
.nav a{white-space:nowrap;text-decoration:none;color:#c4d5e1;background:#13283a;border:1px solid var(--line);padding:7px 11px;border-radius:25px;font-size:10px}
.panel,.service,.category{background:rgba(16,35,56,.86);border:1px solid var(--line);border-radius:15px;padding:15px;margin:11px 0}
.balance{padding:20px;border-radius:18px;background:linear-gradient(110deg,#16474f,#102b41);border:1px solid rgba(84,224,193,.25);margin:18px 0}
.balance small{color:#b8d8d5;font-size:10px}
.balance strong{display:block;font-size:30px;margin:5px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.service{margin:0;cursor:pointer;min-width:0}
.service.selected{border-color:var(--mint)}
.service strong{font-size:12px}
.service p{font-size:11px}
.category{padding:0;overflow:hidden}
.category-toggle{width:100%;padding:14px;background:transparent;border:0;color:var(--mint);text-align:left;font-weight:800;font-size:11px;letter-spacing:.08em;display:flex;justify-content:space-between;cursor:pointer}
.category-content{display:none;padding:0 10px 10px;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.category.open .category-content{display:grid}
.field{display:block;margin:13px 0 6px;color:#c8d9e5;font-size:11px;font-weight:700}
input,select,textarea{width:100%;background:#071725;border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--text);outline:none}
textarea{min-height:85px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--mint)}
button{cursor:pointer}
.btn{border:0;border-radius:10px;padding:11px 14px;background:linear-gradient(110deg,#5ce4c6,#39c8b4);color:#06201e;font-size:11px;font-weight:850;margin-top:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.secondary{background:#20364a;color:#e1edf5;border:1px solid var(--line)}
.danger{background:#48252e;color:#ffd9dd;border:1px solid #75404a}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:5}
.actions .btn{flex:1;position:relative;z-index:6;pointer-events:auto!important;touch-action:manipulation;cursor:pointer}
.note{padding:11px;border-radius:10px;background:#142b3c;color:#bcd2e2;font-size:11px;margin:10px 0}
.success{color:var(--mint)}
.error{color:var(--red)}
.muted{color:var(--muted);font-size:11px}
.hidden{display:none!important}
.admin-label{color:var(--mint);font-size:10px;font-weight:900;letter-spacing:.15em}
  /* NOTIFICATIONS AND REQUEST HISTORY */
.notification-area{position:relative;margin-left:auto}
.notification-button{background:#13283a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12px}
.notification-count{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:20px;background:#ff6878;color:#fff;font-size:10px;font-weight:900;margin-left:4px}
.notification-panel{display:none;position:absolute;right:0;top:44px;width:min(340px,85vw);max-height:380px;overflow-y:auto;background:#102338;border:1px solid var(--line);border-radius:13px;padding:12px;z-index:50;box-shadow:0 12px 35px #0008}
.notification-panel.open{display:block}
.notification-entry{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.notification-entry.unread{border-left:3px solid var(--mint);padding-left:9px}
.notification-entry strong{font-size:12px}
.notification-entry p{margin:4px 0}
.notification-tools{display:flex;gap:7px;flex-wrap:wrap}
.history-filter{max-width:220px}
.item{padding:12px 0;border-bottom:1px solid var(--line)}
.item-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item strong{font-size:12px}
.item small{display:block;color:var(--muted);font-size:10px}
.checkbox{display:flex;gap:8px;align-items:center;font-size:11px;margin-top:12px}
.checkbox input{width:auto}
.loader{width:23px;height:23px;border:2px solid #34516b;border-top-color:var(--mint);border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
footer{text-align:center;border-top:1px solid var(--line);padding:17px;margin-top:25px;color:#72899b;font-size:10px}
@media(max-width:480px){.grid,.category-content{grid-template-columns:1fr}.wrap{padding:14px 12px 35px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"><div class="wrap"><div class="loader"></div><p>Connecting securely to Telegram…</p></div></div>

<script>
(function(){
"use strict";

const API="https://data-verification-api.shrestharaj980888.workers.dev";
const app=document.getElementById("app");
const tg=window.Telegram&&Telegram.WebApp?Telegram.WebApp:null;

let token="";
let user={};
let services=[];
let adminServices=[];
let categories=[];
let selectedCode="";
let adminMode=false;
let adminRole=null;
let adminPermissions=[];
let notificationPollTimer = null;
let notificationIds = new Set();
let notificationsInitialized = false;
let notificationSoundEnabled = localStorage.getItem("dv_notification_sound") !== "off";
let notificationAudioContext = null;
if(tg){
  tg.ready();
  tg.expand();
  if(tg.setHeaderColor)tg.setHeaderColor("#0b1220");
  if(tg.setBackgroundColor)tg.setBackgroundColor("#0b1220");
}

function esc(v){
  return String(v==null?"":v)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function money(cents,currency){
  return (Number(cents||0)/100).toFixed(2)+" "+(currency||"USDT");
}

async function request(path,method="GET",body=null){
  const options={
    method,
    headers:{
      "Authorization":"Bearer "+token,
      "Accept":"application/json"
    }
  };

  if(body!==null){
    if(body instanceof FormData){
      options.body=body;
    }else{
      options.headers["Content-Type"]="application/json";
      options.body=JSON.stringify(body);
    }
  }

  const response=await fetch(API+path,options);
  const data=await response.json();

  if(!response.ok||!data.ok){
   throw new Error(
  (data.error || "Request failed (" + response.status + ")") +
  (data.details ? " | Details: " + data.details : "")
);
  }

  return data;
}

function showError(message){
  app.innerHTML='<main class="wrap"><div class="panel"><h2>Connection problem</h2><p class="error">'+esc(message)+'</p><button class="btn" onclick="location.reload()">Try again</button></div></main>';
}

function renderLoginScreen(messageText="Open the Mini App using Telegram to continue."){
  app.innerHTML=`
    <main class="wrap">
      <header>
        <div class="brand"><div class="logo">DV</div><div><strong>DATA VERIFICATION</strong><small>SECURE CUSTOMER PORTAL</small></div></div>
        <span class="status">SECURE LOGIN</span>
      </header>
      <section class="panel" style="margin-top:28px">
        <h2>Sign up / Log in</h2>
        <p>${esc(messageText)}</p>
        <p>Continue with Telegram. Your account is created automatically if this is your first visit.</p>
        <button class="btn" id="telegram-login-button" type="button">Continue with Telegram</button>
      </section>
    </main>`;
  const button=document.getElementById("telegram-login-button");
  if(button)button.onclick=login;
}

async function login(){
  if(!tg||!tg.initData){
    showError("Please open this Mini App from your Telegram bot.");
    return;
  }

  app.innerHTML='<main class="wrap"><div class="loader"></div><p>Verifying Telegram account…</p></main>';

  try{
    const response=await fetch(API+"/api/auth",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({initData:tg.initData})
    });

    const data=await response.json();

    if(!response.ok||!data.ok)throw new Error(data.error||"Login failed");

    token=data.token;

    const me=await request("/api/me");
    user=me.user||data.user||{};

    adminMode=!!user.is_admin;
    adminRole=user.admin_role||null;
    adminPermissions=Array.isArray(user.admin_permissions)?user.admin_permissions:[];
    await loadCustomerServices();

    if(adminMode && (
      adminRole==="main_admin" ||
      adminRole==="full_admin" ||
      adminPermissions.includes("catalogue_manage")
    )){
      try{
        const admin=await request("/api/admin/catalogue");
        categories=admin.categories||[];
        adminServices=admin.services||adminServices;
      }catch(error){
        console.warn("Admin catalogue unavailable:",error.message);
      }
    }

    renderDashboard();

  }catch(error){
    showError(error.message||"Secure login failed.");
  }
}

async function loadCustomerServices(){
  const data=await request("/api/services");
  services=data.services||[];
}

function balanceText(){
  const cents=user.wallet_balance_cents??user.balance_cents??user.wallet_cents;
  if(cents===undefined||cents===null)return "Balance unavailable";
  return money(cents,"USDT");
}
async function refreshWalletBalance(){
  try{
    const data=await request("/api/me");
    user=data.user||user;

    const balance=balanceText();

    const mainBalance=document.getElementById("main-wallet-balance");
    const walletBalance=document.getElementById("wallet-section-balance");

    if(mainBalance)mainBalance.textContent=balance;
    if(walletBalance)walletBalance.textContent=balance;
  }catch(error){
    console.error("Wallet balance refresh failed:",error);
  }
}
async function loadOrders(){
  const message = document.getElementById("orders-message");
  const list = document.getElementById("orders-list");
  const refreshButton = document.getElementById("orders-refresh");

  if(!message || !list) return;

  if(refreshButton) refreshButton.disabled = true;

  message.textContent = "Loading order history...";
  list.innerHTML = "";

  try{
    const result = await request("/api/orders?limit=20&offset=0");

    const orders = result.orders || [];

    if(!orders.length){
      message.textContent = "No order history found.";
      list.innerHTML = "";
      return;
    }

    message.textContent =
      "Showing " + orders.length + " of " +
      (result.pagination?.total || orders.length) + " orders.";

    list.innerHTML = orders.map(order => {
      const amount = order.customer_charge_cents == null
        ? "Not available"
        : money(
            Number(order.customer_charge_cents),
            order.currency || "USD"
          );

      return `
        <div class="item">
          <strong>Order #${esc(String(order.id))}</strong>
          <div>Service: ${esc(order.resource_code || "Unknown")}</div>
          <div>Quantity: ${esc(String(order.quantity ?? "—"))}</div>
          <div>Amount: ${esc(amount)}</div>
          <div>Status: ${esc(order.status || "Unknown")}</div>
          <small>Created: ${esc(String(order.created_at || "—"))}</small>
        </div>
      `;
    }).join("");

  }catch(error){
    message.textContent =
      "Could not load order history: " + error.message;

    list.innerHTML = "";
  }finally{
    if(refreshButton) refreshButton.disabled = false;
  }
}
function formatDate(value){
  if(!value)return "—";
  let dateString=String(value);
  if(!/[zZ]|[+-]\d{2}:\d{2}$/.test(dateString)){
    dateString=dateString.replace(" ","T")+"Z";
  }
  const date=new Date(dateString);
  return isNaN(date.getTime())?String(value):date.toLocaleString();
}

function playNotificationSound(){
  try{
    const AudioContext=window.AudioContext||window.webkitAudioContext;
    if(!AudioContext)return;

    if(!notificationAudioContext){
      notificationAudioContext=new AudioContext();
    }

    if(notificationAudioContext.state==="suspended"){
      notificationAudioContext.resume();
    }

    const oscillator=notificationAudioContext.createOscillator();
    const gain=notificationAudioContext.createGain();

    oscillator.type="sine";
    oscillator.frequency.value=880;
    gain.gain.setValueAtTime(0.08,notificationAudioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      0.001,
      notificationAudioContext.currentTime+0.25
    );

    oscillator.connect(gain);
    gain.connect(notificationAudioContext.destination);
    oscillator.start();
    oscillator.stop(notificationAudioContext.currentTime+0.25);
  }catch(error){
    console.warn("Notification sound unavailable:",error);
  }
}

function renderNotifications(data){
  const count=document.getElementById("notification-count");
  const list=document.getElementById("notification-list");

  if(!count||!list)return;

  const notifications=data.notifications||[];
  const unread=Number(data.unread_count||0);

  count.textContent=unread>99?"99+":String(unread);

  if(!notifications.length){
    list.innerHTML='<p class="muted">No notifications yet.</p>';
    return;
  }

  list.innerHTML=notifications.map(item=>`
    <div class="notification-entry ${item.read_at?"":"unread"}"
         data-notification-id="${esc(item.id)}">
      <strong>${esc(item.title||"Notification")}</strong>
      <p>${esc(item.message||"")}</p>
      <small>${esc(formatDate(item.created_at))}</small>
      <div><small>${item.read_at?"Read":"Unread — click to mark as read"}</small></div>
    </div>
  `).join("");
}

async function loadNotifications(isPoll=false){
  try{
    const data=await request("/api/notifications");
    const notifications=data.notifications||[];

    if(isPoll&&notificationsInitialized){
      const hasNew=notifications.some(item=>
        !notificationIds.has(String(item.id))
      );

      if(hasNew&&notificationSoundEnabled){
        playNotificationSound();
      }
    }

    notificationIds=new Set(
      notifications.map(item=>String(item.id))
    );

    notificationsInitialized=true;
    renderNotifications(data);
  }catch(error){
    const list=document.getElementById("notification-list");
    if(list)list.innerHTML=
      '<p class="error">Could not load notifications: '+
      esc(error.message)+'</p>';
  }
}

function wireNotifications(){
  const toggle=document.getElementById("notification-toggle");
  const panel=document.getElementById("notification-panel");
  const refresh=document.getElementById("notification-refresh");
  const sound=document.getElementById("notification-sound-toggle");
  const markAll=document.getElementById("notification-mark-all");
  const list=document.getElementById("notification-list");

  if(!toggle||!panel||!refresh||!sound||!markAll||!list)return;

  toggle.onclick=()=>{
    const opened=panel.classList.toggle("open");
    toggle.setAttribute("aria-expanded",String(opened));
    if(opened)loadNotifications();
  };

  refresh.onclick=()=>loadNotifications();

  sound.textContent="Sound: "+(notificationSoundEnabled?"On":"Off");

  sound.onclick=()=>{
    notificationSoundEnabled=!notificationSoundEnabled;
    localStorage.setItem(
      "dv_notification_sound",
      notificationSoundEnabled?"on":"off"
    );
    sound.textContent="Sound: "+(notificationSoundEnabled?"On":"Off");
  };

  list.onclick=async event=>{
    const entry=event.target.closest(".notification-entry");
    if(!entry||!entry.classList.contains("unread"))return;

    const id=Number(entry.dataset.notificationId);
    if(!Number.isInteger(id)||id<=0)return;

    try{
      await request("/api/notifications/read","POST",{
        notification_id:id
      });
      await loadNotifications();
    }catch(error){
      alert("Could not mark notification as read: "+error.message);
    }
  };

  markAll.onclick=async()=>{
    const unreadEntries=[
      ...list.querySelectorAll(".notification-entry.unread")
    ];

    if(!unreadEntries.length)return;

    markAll.disabled=true;

    try{
      for(const entry of unreadEntries){
        const id=Number(entry.dataset.notificationId);
        if(Number.isInteger(id)&&id>0){
          await request("/api/notifications/read","POST",{
            notification_id:id
          });
        }
      }
      await loadNotifications();
    }catch(error){
      alert("Could not mark all notifications as read: "+error.message);
    }finally{
      markAll.disabled=false;
    }
  };

  loadNotifications();

  if(notificationPollTimer){
    clearInterval(notificationPollTimer);
  }

  notificationPollTimer=setInterval(()=>{
    loadNotifications(true);
  },45000);
}
  async function loadRequestHistory(){
  const message=document.getElementById("request-history-message");
  const list=document.getElementById("request-history-list");
  const filter=document.getElementById("request-history-filter");

  if(!message||!list||!filter)return;

  message.textContent="Loading your file requests…";
  list.innerHTML="";

  try{
    const result=await request(
      "/api/toolbox/number-file-requests/history?status="+
      encodeURIComponent(filter.value)
    );

    const requests=result.requests||[];

    if(!requests.length){
      message.textContent="No file requests found.";
      return;
    }

    message.textContent="Showing "+requests.length+" request(s).";

    list.innerHTML=requests.map(item=>`
      <div class="item">
        <div class="item-top">
          <strong>Request #${esc(item.id)}</strong>
          <strong>${esc((item.status||"pending").toUpperCase())}</strong>
        </div>
        <div>Country: ${esc(item.country_code||"—")}</div>
        <div>Type: ${esc(item.number_type||"—")}</div>
        <div>Quantity: ${esc(item.quantity??"—")}</div>
        <small>Submitted: ${esc(formatDate(item.created_at))}</small>
        ${item.admin_file_name?`<div>File: ${esc(item.admin_file_name)}</div>`:""}
        ${item.admin_note?`<div>Admin note: ${esc(item.admin_note)}</div>`:""}
        ${item.completed_at?`<small>Completed: ${esc(formatDate(item.completed_at))}</small>`:""}
        ${item.rejected_at?`<small>Rejected: ${esc(formatDate(item.rejected_at))}</small>`:""}
      </div>
    `).join("");

  }catch(error){
    message.textContent="Could not load file requests: "+error.message;
  }
}

function wireRequestHistory(){
  const filter=document.getElementById("request-history-filter");
  const refresh=document.getElementById("request-history-refresh");

  if(!filter||!refresh)return;

  filter.onchange=loadRequestHistory;
  refresh.onclick=loadRequestHistory;

  loadRequestHistory();
}
async function wireWallet(){
  const amountInput=document.getElementById("wallet-deposit-amount");
  const methodInput=document.getElementById("wallet-deposit-method");
  const referenceInput=document.getElementById("wallet-deposit-reference");
  const submitButton=document.getElementById("wallet-deposit-submit");
  const message=document.getElementById("wallet-deposit-message");
  const historyBox=document.getElementById("wallet-deposit-history");
  const refreshButton=document.getElementById("wallet-deposit-refresh");

  if(!submitButton||!historyBox)return;

  async function loadWalletDeposits(){
    historyBox.textContent="Loading deposit history…";
    if(refreshButton)refreshButton.disabled=true;
    try{
      const data=await request("/api/wallet/deposits");
      const deposits=data.deposits||[];
      if(!deposits.length){
        historyBox.innerHTML='<p class="muted">You have not submitted any deposit requests.</p>';
        return;
      }
      historyBox.innerHTML=deposits.map(d=>{
        const status=String(d.status||"pending").toLowerCase();
        const statusClass=status==="approved"?"success":status==="rejected"?"error":"";
        return `
          <div class="item">
            <div class="item-top">
              <strong>Deposit #${Number(d.id)} · ${esc(money(d.amount_cents,d.currency||"USDT"))}</strong>
              <span class="pill ${statusClass}">${esc(status.toUpperCase())}</span>
            </div>
            <div class="muted">Network: ${esc(d.payment_method||"Not specified")}</div>
            <div class="muted">Reference: ${esc(d.payment_reference||"Not provided")}</div>
            <div class="muted">Submitted: ${esc(formatDate(d.created_at))}</div>
${d.reviewed_at?`<div class="muted">Reviewed: ${esc(formatDate(d.reviewed_at))}</div>`:""}
${d.admin_note?`<div class="muted">Admin note: ${esc(d.admin_note)}</div>`:""}
          </div>
        `;
      }).join("");
    }catch(error){
      historyBox.textContent="Could not load deposit history: "+error.message;
    }finally{
      if(refreshButton)refreshButton.disabled=false;
    }
  }

  submitButton.onclick=async()=>{
    const amount=Number(amountInput.value);
    const amountCents=Math.round(amount*100);
    const paymentReference=referenceInput.value.trim();

    if(!Number.isFinite(amount)||amount<=0||!Number.isSafeInteger(amountCents)){
      message.textContent="Enter a valid deposit amount (minimum 0.01 USDT).";
      return;
    }
    if(amountCents>100000000){
      message.textContent="The maximum request is 1,000,000 USDT.";
      return;
    }
    if(!/^[a-zA-Z0-9._:/-]{3,200}$/.test(paymentReference)){
      message.textContent="Enter a valid transaction ID/hash (3–200 letters, numbers or . _ : / -).";
      return;
    }
    if(!confirm("Submit this USDT deposit for manual verification? Do not submit unless you have completed a transfer using the administrator's official payment instructions."))return;

    submitButton.disabled=true;
    submitButton.textContent="Submitting…";
    message.textContent="Sending your deposit request…";
    try{
      const data=await request("/api/wallet/deposits","POST",{
        amount_cents:amountCents,
        payment_method:methodInput.value,
        payment_reference:paymentReference
      });
      message.textContent="Deposit request #"+data.deposit_id+" submitted. Your wallet will be credited only after admin verification.";
      amountInput.value="";
      referenceInput.value="";
      await loadWalletDeposits();
    }catch(error){
      message.textContent="Submission failed: "+error.message;
    }finally{
      submitButton.disabled=false;
      submitButton.textContent="Submit deposit for review";
    }
  };

  if(refreshButton)refreshButton.onclick=loadWalletDeposits;
  await loadWalletDeposits();
}

function renderDashboard(){
  const name=user.first_name||"Customer";

  app.innerHTML=`
  <main class="wrap">
    <header>
       <div class="brand">
    <div class="logo">DV</div>
    <div><strong>DATA VERIFICATION</strong><small>SECURE CUSTOMER PORTAL</small></div>
  </div>

document.getElementById("customer-file").addEventListener("change", async function(){
  const file = this.files && this.files[0];
  const resultBox = document.getElementById("upload-file-result");
  const entriesBox = document.getElementById("entries");

  if (!file) return;

  if (file.size > 20 * 1024 * 1024) {
    resultBox.textContent = "File must be smaller than 20 MB.";
    this.value = "";
    return;
  }

  try {
    const content = await file.text();

    let lines = content.split(/\r?\n/);

    if (/\.csv$/i.test(file.name)) {
      lines = lines.map(line => {
        const firstColumn = line.split(",")[0].trim();
        return firstColumn.replace(/^["']|["']$/g, "").trim();
      });
    }

    const cleaned = lines.filter(line => line.trim() !== "");

    entriesBox.value = cleaned.join("\n");

    resultBox.textContent =

function renderServices(){
  const box=document.getElementById("services-list");
  const select=document.getElementById("service-select");

  if(!box||!select)return;

  const groups={};

  services.forEach(s=>{
    const category=s.category||"Other Services";
    if(!groups[category])groups[category]=[];
    groups[category].push(s);
  });

  let html="";

  Object.keys(groups).forEach((category,index)=>{
    const items=groups[category];
    const open=index===0||items.some(s=>s.resource_code===selectedCode);

    html+=`<section class="category ${open?"open":""}">
      <button class="category-toggle" type="button">
        <span>${esc(category)} · ${items.length} services</span><span>⌄</span>
      </button>
      <div class="category-content">`;

    items.forEach(s=>{
      const selected=s.resource_code===selectedCode;
      const status=!s.configured?"Pricing not configured":
        !s.enabled?"Not active":
        !s.can_order?"Ordering unavailable":"Available";

      const priceText=s.configured&&s.unit_price_cents!=null
        ?"Price: "+money(
          Math.ceil(
            Number(s.unit_price_cents)*
            Number(s.minimum_order_quantity)/
            Number(s.pricing_unit_quantity)
          ),
          s.currency
        )+" / minimum order"
        :"Price not configured";

      html+=`<article class="service ${selected?"selected":""}" data-code="${esc(s.resource_code)}">
        <strong>${esc(s.name)}</strong>
        <p>${esc(s.description)}</p>
        <span class="pill">${esc(status)}</span>
        <p>Minimum quantity: ${s.minimum_order_quantity==null?"Not set":Number(s.minimum_order_quantity).toLocaleString()}</p>
        <p>${esc(priceText)}</p>
      </article>`;
    });

    html+="</div></section>";
  });

  box.innerHTML=html||'<div class="panel"><p>No services currently listed.</p></div>';

  select.innerHTML='<option value="">Choose service</option>'+
    services.map(s=>`<option value="${esc(s.resource_code)}">${esc(s.category)} — ${esc(s.name)}</option>`).join("");

  select.value=selectedCode;

  box.querySelectorAll(".category-toggle").forEach(button=>{
    button.onclick=()=>button.closest(".category").classList.toggle("open");
  });

  box.querySelectorAll("[data-code]").forEach(card=>{
    card.onclick=()=>{
      selectedCode=card.dataset.code;
      select.value=selectedCode;
      renderServices();
      updateEstimate();
    };
  });
}


function updateEstimate(){
  const box = document.getElementById("estimate-result");
  const quantity = document.getElementById("quantity");

  if (!box || !quantity) return;

  const service = services.find(
    s => s.resource_code === selectedCode
  );

  if (!service) {
    box.textContent = "Select a service to view its pricing.";
    return;
  }

  if (
    !service.configured ||
    service.unit_price_cents == null ||
    !service.pricing_unit_quantity
  ) {
    box.textContent = "Pricing is not configured for this service.";
    return;
  }

  const amount = Number(quantity.value || 0);
  const minimum = Number(service.minimum_order_quantity || 0);

  if (!Number.isSafeInteger(amount) || amount < 1) {
    box.textContent = "Enter a valid quantity.";
    return;
  }

  if (minimum && amount < minimum) {
    const minimumPrice = Math.ceil(
      Number(service.unit_price_cents) *
      minimum /
      Number(service.pricing_unit_quantity)
    );

    box.textContent =
      "Your quantity: " + amount +
      " · Minimum quantity: " + minimum +
      " · Minimum price estimate: " +
      money(minimumPrice, service.currency) +
      ". Ordering is disabled.";

    return;
  }

  const total = Math.ceil(
    Number(service.unit_price_cents) *
    amount /
    Number(service.pricing_unit_quantity)
  );

  box.textContent =
    "Estimated price: " + money(total, service.currency) +
    " · Estimate quantity: " + amount.toLocaleString() +
    " · Estimate only; ordering is disabled.";
}



function previewInput(){
  const service = services.find(
    s => s.resource_code === selectedCode
  );

  const result = document.getElementById("preview-result");
  const entriesBox = document.getElementById("entries");

  const entries = entriesBox.value
    .split(/\r?\n/)
    .map(x => x.trim())
    .filter(Boolean);

  if (!service) {
    result.textContent = "Please select a service first.";
    return;
  }

  if (!entries.length) {
    result.textContent = "Enter at least one item.";
    return;
  }

  const normalized = entries.map(x => x.toLowerCase());
  const unique = new Set(normalized);
  const duplicates = entries.length - unique.size;

  let valid = 0;

  if (service.input_type === "email") {
    valid = entries.filter(x =>
      /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x)
    ).length;

  } else if (service.input_type === "username") {
    valid = entries.filter(x =>
      /^@?[a-zA-Z0-9_]{5,32}$/.test(x)
    ).length;

  } else {
    valid = entries.filter(x => {
      const normalizedPhone = x.replace(/[\s()-]/g, "");
      return /^\+?[1-9]\d{6,14}$/.test(normalizedPhone);
    }).length;
  }

  const invalid = entries.length - valid;

  result.textContent =
    "REVIEW COMPLETE" +
    " · Total entries: " + entries.length +
    " · Valid format: " + valid +
    " · Invalid format: " + invalid +
    " · Duplicate entries: " + duplicates +
    ". Preview only. Nothing was submitted or ordered.";
}

function renderAdminCategories(){
  const box=document.getElementById("admin-categories");
  if(!box)return;

  box.innerHTML=categories.map(c=>`
    <div class="item" data-category="${esc(c.category)}">
      <div class="item-top">
        <strong>${esc(c.category)}</strong>
        <span class="pill">${Number(c.is_listed)===1?"Published":"Hidden"}</span>
      </div>
      <div class="row">
        <div>
          <label class="field">Rename category</label>
          <input class="rename-value" value="${esc(c.category)}" maxlength="80">
        </div>
        <div>
          <label class="field">Display order</label>
          <input class="order-value" type="number" min="0" value="${Number(c.display_order)||0}">
        </div>
      </div>
      <div class="actions">
        <button class="btn rename-button">Rename</button>
        <button class="btn secondary order-button">Save order</button>
        <button class="btn secondary visibility-button">${Number(c.is_listed)===1?"Hide":"Publish"}</button>
      </div>
    </div>`).join("")||'<p>No categories found.</p>';

  box.querySelectorAll("[data-category]").forEach(item=>{
    const category=item.dataset.category;

    item.querySelector(".rename-button").onclick=async()=>{
      const newName=item.querySelector(".rename-value").value.trim();

      if(!newName)return alert("Enter a category name.");
      if(newName===category)return alert("The category name is unchanged.");
      if(!confirm("Rename "+category+" to "+newName+"?"))return;

      await adminAction(async()=>{
        await request("/api/admin/categories","POST",{
          action:"rename",
          old_category:category,
          new_category:newName
        });

        await reloadAdmin();
      });
    };

    item.querySelector(".order-button").onclick=async()=>{
      const orderItems=[...box.querySelectorAll("[data-category]")];

      const ordered=orderItems.map(el=>({
        name:el.dataset.category,
        order:Number(el.querySelector(".order-value").value)
      }));

      if(ordered.some(x=>!Number.isSafeInteger(x.order)||x.order<0)){
        return alert("Enter valid display orders.");
      }

      ordered.sort((a,b)=>a.order-b.order);

      await adminAction(async()=>{
        await request("/api/admin/categories","POST",{
          action:"reorder",
          categories:ordered.map(x=>x.name)
        });

        await reloadAdmin();
      });
    };

    item.querySelector(".visibility-button").onclick=async()=>{
      const current=categories.find(c=>c.category===category);

      await adminAction(async()=>{
        await request("/api/admin/categories","POST",{
          action:"visibility",
          category,
          is_listed:Number(current.is_listed)===1?0:1
        });

        await reloadAdmin();
      });
    };
  });
}

function applyAdminUiPermissions(){
  if(!adminMode)return;
  const allowed=permission=>adminRole==="main_admin"||
    adminRole==="full_admin"||adminPermissions.includes(permission);
  const section=document.getElementById("admin");
  if(!section)return;
  const rules=[
    ["#admin-deposits-refresh","wallet_deposits"],
    ["#new-category","catalogue_manage"],
    ["#admin-service-select","catalogue_manage"],
    ["#price-service","catalogue_manage"],
    ["#visibility-service","catalogue_manage"],
    ["#cn-validate-upload","checknumber_validate"],
    ["#refresh-admin-uploads","uploads_manage"],
    ["#refresh-number-requests","number_requests"]
  ];
  const panelPermissions=[
    ["Wallet deposit review","wallet_deposits"],
    ["Add a category","catalogue_manage"],
    ["Add or edit a service","catalogue_manage"],
    ["Service pricing","catalogue_manage"],
    ["Publish / hide a service","catalogue_manage"],
    ["CheckNumber.ai File Upload","checknumber_validate"],
    ["Provider Balance","provider_balance"],
    ["Telegram Storage Connection","storage_test"],
    ["Admin Upload Management","uploads_manage"],
    ["Manual Number File Requests","number_requests"]
  ];
  section.querySelectorAll(".panel").forEach(panel=>{
    if(panel===section)return;
    const heading=panel.querySelector("h3,h2");
    const title=heading?.textContent?.trim();
    const match=panelPermissions.find(([label])=>label===title);
    if(match&&!allowed(match[1]))panel.hidden=true;
  });
  if(!allowed("catalogue_manage")){
    const categories=document.getElementById("admin-categories");
    const heading=categories?.previousElementSibling;
    if(heading)heading.hidden=true;
    if(categories)categories.hidden=true;
  }
  for(const [selector,permission] of rules){
    const el=section.querySelector(selector);
    if(el&&!allowed(permission)){
      const panel=el.closest(".panel")||el.parentElement;
      if(panel)panel.hidden=true;
    }
  }
  if(adminRole!=="main_admin"){
    const manager=document.getElementById("admin-management-panel");
    if(manager)manager.hidden=true;
  }
}

function wireAdminManagement(){
  if(adminRole!=="main_admin")return;
  const panel=document.getElementById("admin-management-panel");
  if(!panel)return;
  const idInput=document.getElementById("managed-admin-telegram-id");
  const roleSelect=document.getElementById("managed-admin-role");
  const permissionBox=document.getElementById("managed-admin-permissions");
  const saveButton=document.getElementById("managed-admin-save");
  const clearButton=document.getElementById("managed-admin-clear");
  const refreshButton=document.getElementById("admin-management-refresh");
  const message=document.getElementById("admin-management-message");
  const list=document.getElementById("admin-management-list");
  let editingId="";

  function selectedPermissions(){
    return [...permissionBox.querySelectorAll('input[type="checkbox"]:checked')]
      .map(input=>input.value);
  }
  function setPermissions(values){
    permissionBox.querySelectorAll('input[type="checkbox"]').forEach(input=>{
      input.checked=values.includes(input.value);
    });
  }
  function clearForm(){
    editingId="";
    idInput.value="";
    idInput.disabled=false;
    roleSelect.value="sub_admin";
    setPermissions([]);
    saveButton.textContent="Grant administrator access";
    permissionBox.hidden=false;
  }
  roleSelect.onchange=()=>{permissionBox.hidden=roleSelect.value!=="sub_admin";};
  clearButton.onclick=clearForm;

  async function loadAdmins(){
    message.textContent="Loading administrators…";
    list.innerHTML="";
    refreshButton.disabled=true;
    try{
      const data=await request("/api/admin/management");
      const admins=data.admins||[];
      message.textContent="Total administrator accounts: "+admins.length;
      if(!admins.length){
        list.innerHTML='<p class="muted">No administrators found.</p>';
        return;
      }
      list.innerHTML=admins.map(admin=>{
        const main=admin.role==="main_admin";
        const active=Number(admin.is_active)===1;
        const permissions=Array.isArray(admin.permissions)?admin.permissions:[];
        const roleLabel=main?"Main Admin":admin.role==="full_admin"?"Full Admin":"Sub Admin";
        const name=admin.first_name||admin.username||("Telegram ID "+admin.telegram_id);
        const permissionText=admin.role==="sub_admin"
          ?permissions.map(key=>data.permission_options[key]||key).join(", ")||"No permissions assigned"
          :"All operational permissions";
        return `
          <div class="item" data-admin-id="${esc(admin.telegram_id)}">
            <div class="item-top">
              <strong>${esc(name)}</strong>
              <span class="pill">${active?"Active":"Restricted"}</span>
            </div>
            <div class="muted">Telegram ID: ${esc(admin.telegram_id)}</div>
            <div class="muted">Role: ${esc(roleLabel)}</div>
            <div class="muted">Permissions: ${esc(permissionText)}</div>
            ${main?'<p class="note success">Protected Main Admin account</p>':`
              <div class="actions">
                <button class="btn secondary edit-managed-admin" type="button">Edit / Promote</button>
                <button class="btn ${active?"danger":"secondary"} toggle-managed-admin" data-action="${active?"revoke":"restore"}" type="button">${active?"Restrict / Revoke":"Restore access"}</button>
              </div>`}
          </div>`;
      }).join("");
    }catch(error){
      message.textContent="Could not load administrators: "+error.message;
    }finally{
      refreshButton.disabled=false;
    }
  }

  saveButton.onclick=async()=>{
    const targetId=idInput.value.trim();
    const role=roleSelect.value;
    const permissions=role==="sub_admin"?selectedPermissions():[];
    if(!/^\d{5,20}$/.test(targetId)){
      message.textContent="Enter a valid numeric Telegram ID.";
      return;
    }
    if(role==="sub_admin"&&!permissions.length){
      message.textContent="Select at least one permission for a Sub Admin.";
      return;
    }
    saveButton.disabled=true;
    try{
      await request("/api/admin/management","POST",{
        action:editingId?"update":"grant",
        telegram_id:targetId,
        role,
        permissions
      });
      message.textContent="Administrator access saved.";
      clearForm();
      await loadAdmins();
    }catch(error){
      message.textContent="Could not save administrator: "+error.message;
    }finally{
      saveButton.disabled=false;
    }
  };

  refreshButton.onclick=loadAdmins;
  list.addEventListener("click",async event=>{
    const item=event.target.closest("[data-admin-id]");
    if(!item)return;
    const targetId=item.dataset.adminId;
    const editButton=event.target.closest(".edit-managed-admin");
    const toggleButton=event.target.closest(".toggle-managed-admin");
    if(editButton){
      const data=await request("/api/admin/management");
      const admin=(data.admins||[]).find(entry=>String(entry.telegram_id)===targetId);
      if(!admin)return;
      editingId=targetId;
      idInput.value=targetId;
      idInput.disabled=true;
      roleSelect.value=admin.role;
      setPermissions(Array.isArray(admin.permissions)?admin.permissions:[]);
      permissionBox.hidden=admin.role!=="sub_admin";
      saveButton.textContent="Save administrator changes";
      idInput.scrollIntoView({behavior:"smooth",block:"center"});
      return;
    }
    if(toggleButton){
      const action=toggleButton.dataset.action;
      if(!confirm((action==="revoke"?"Restrict and revoke":"Restore")+" admin access for Telegram ID "+targetId+"?"))return;
      toggleButton.disabled=true;
      try{
        await request("/api/admin/management","POST",{action,telegram_id:targetId});
        message.textContent=action==="revoke"?"Access revoked and active sessions cleared.":"Access restored.";
        await loadAdmins();
      }catch(error){
        message.textContent="Could not update access: "+error.message;
        toggleButton.disabled=false;
      }
    }
  });
  loadAdmins();
}

    if(!message||!box)return;

    message.textContent="Loading uploaded files…";
    box.innerHTML="";

    if(button)button.disabled=true;

    try{
      const data=await request("/api/admin/uploads?limit=50&offset=0");

      if(!data.ok){
        throw new Error(data.error||"Unable to load uploads");
      }

      const uploads=data.uploads||[];

      message.textContent="Total uploads: "+Number(data.pagination?.total||0);

      if(!uploads.length){
        box.innerHTML='<p class="muted">No uploaded files found.</p>';
        return;
      }

      box.innerHTML=uploads.map(upload=>{
        const size=(Number(upload.file_size||0)/1024).toFixed(1);

        const expiry=upload.expires_at
          ?new Date(upload.expires_at).toLocaleString()
          :"Not available";

        const created=upload.created_at
          ?new Date(upload.created_at.replace(" ","T")+"Z").toLocaleString()
          :"Not available";

        const reviewed=upload.reviewed_at
          ?new Date(upload.reviewed_at).toLocaleString()
          :"Not reviewed";

        const currentStatus=upload.status||"uploaded";

        const statuses=["uploaded","reviewed","rejected","expired"];

        const statusOptions=statuses.map(status=>
          `<option value="${status}" ${currentStatus===status?"selected":""}>${status.charAt(0).toUpperCase()+status.slice(1)}</option>`
        ).join("");

        return `
         <div
  class="item"
  data-upload-id="${Number(upload.id)}"
  data-customer-id="${Number(upload.user_id)}"
  data-file-name="${esc(upload.file_name||"").toLowerCase()}"
  data-status="${esc(currentStatus)}"
>
            <div class="item-top">
              <strong>${esc(upload.file_name||"Unnamed file")}</strong>
              <span class="pill">${esc(currentStatus)}</span>
            </div>

            <div class="muted">Upload ID: ${Number(upload.id)}</div>
            <div class="muted">Customer ID: ${Number(upload.user_id)}</div>
            <div class="muted">Service: ${esc(upload.resource_code||"Not specified")}</div>
            <div class="muted">File type: ${esc(upload.mime_type||"Unknown")}</div>
            <div class="muted">File size: ${size} KB</div>
            <div class="muted">Uploaded: ${esc(created)}</div>
            <div class="muted">Expires: ${esc(expiry)}</div>

            <div class="muted">Last reviewed: ${esc(reviewed)}</div>

            <div class="muted">
              Reviewed by admin ID: ${upload.reviewed_by==null?"Not reviewed":Number(upload.reviewed_by)}
            </div>

            <label class="field">Upload status</label>
            <select class="upload-status">
              ${statusOptions}
            </select>

            <label class="field">Private admin note</label>
            <textarea class="upload-admin-note" maxlength="1000" placeholder="Enter a private review note">${esc(upload.admin_note||"")}</textarea>

            <button class="btn save-upload-status" type="button">
              Save Status
            </button>
            ${upload.resource_code==="phoneCheck" && ["uploaded","reviewed"].includes(currentStatus) && Number(upload.provider_task_exists)!==1 ? '<button class="btn submit-provider-task" type="button">Submit to CheckNumber</button>' : Number(upload.provider_task_exists)===1 ? '<p class="muted">A provider task already exists for this upload. Check Provider Tasks for its status.</p>' : ''}
          </div>
        `;
      }).join("");
      function filterAdminUploads(){
        const search=document.getElementById("upload-search");
        const filter=document.getElementById("upload-status-filter");

        const query=(search?.value||"").trim().toLowerCase();
        const selectedStatus=filter?.value||"all";

        const items=box.querySelectorAll("[data-upload-id]");

        let visible=0;

        items.forEach(item=>{
          const uploadId=item.dataset.uploadId||"";
          const customerId=item.dataset.customerId||"";
          const fileName=item.dataset.fileName||"";
          const status=item.dataset.status||"";

          const matchesSearch=
            !query ||
            uploadId.includes(query) ||
            customerId.includes(query) ||
            fileName.includes(query);

          const matchesStatus=
            selectedStatus==="all" ||
            status===selectedStatus;

          const show=matchesSearch&&matchesStatus;

          item.style.display=show?"":"none";

          if(show)visible++;
        });

        const count=document.getElementById("upload-filter-count");

        if(count){
          count.textContent="Showing "+visible+" of "+items.length+" uploads";
        }
      }

      const searchInput=document.getElementById("upload-search");
      const statusFilter=document.getElementById("upload-status-filter");

      if(searchInput){
        searchInput.oninput=filterAdminUploads;
      }

      if(statusFilter){
        statusFilter.onchange=filterAdminUploads;
      }

      filterAdminUploads();
      box.querySelectorAll("[data-upload-id]").forEach(item=>{
        const saveButton=item.querySelector(".save-upload-status");

        saveButton.onclick=async()=>{
          const uploadId=Number(item.dataset.uploadId);
          const status=item.querySelector(".upload-status").value;
          const adminNote=item.querySelector(".upload-admin-note").value.trim();

          saveButton.disabled=true;
          saveButton.textContent="Saving…";

          try{
            const result=await request("/api/admin/uploads/status","POST",{
              upload_id:uploadId,
              status,
              admin_note:adminNote
            });

            if(!result.ok){
              throw new Error(result.error||"Unable to update upload");
            }

            await loadAdminUploads();

            message.textContent="Upload #"+uploadId+" status saved successfully.";

          }catch(error){
            alert("Could not save upload status: "+error.message);
            saveButton.disabled=false;
            saveButton.textContent="Save Status";
          }
        };
      });

      box.querySelectorAll(".submit-provider-task").forEach(button=>{
        button.onclick=async()=>{
          const item=button.closest("[data-upload-id]");
          const uploadId=Number(item?.dataset.uploadId);
          if(!uploadId || !confirm("Submit upload #"+uploadId+" to CheckNumber? This may consume provider balance and cannot be automatically reversed.")) return;
          button.disabled=true;
          button.textContent="Submitting…";
          try{
            const result=await request("/api/admin/provider-tasks/submit","POST",{upload_id:uploadId});
            alert("Provider task submitted. Local task #"+result.task.id+" / Provider ID: "+result.task.provider_task_id);
            await loadProviderTasks();
            await loadAdminUploads();
          }catch(error){
            alert("Submission result: "+error.message+". If the result is uncertain, do not submit again; check provider dashboard first.");
            button.disabled=false;
            button.textContent="Submit to CheckNumber";
          }
        };
      });

    }catch(error){
      message.textContent="Error: "+error.message;
    }finally{
      if(button)button.disabled=false;
    }
  }


  async function loadProviderTasks(){
    const message=document.getElementById("provider-tasks-message");
    const box=document.getElementById("provider-tasks-list");
    if(!message||!box)return;
    message.textContent="Loading provider tasks…";
    try{
      const data=await request("/api/admin/provider-tasks");
      const tasks=data.tasks||[];
      message.textContent="Provider tasks: "+tasks.length;
      box.innerHTML=tasks.map(task=>{
        const canPoll=["submitted","processing","delivery_pending"].includes(task.status);
        return '<div class="item"><div class="item-top"><strong>Task #'+esc(task.id)+'</strong><span class="pill">'+esc(task.status)+'</span></div>'+
          '<div class="muted">Upload #'+esc(task.upload_id)+' · '+esc(task.resource_code)+' · Provider ID: '+esc(task.provider_task_id||"not assigned")+'</div>'+
          '<div class="muted">Total: '+esc(task.total??"—")+' · Success: '+esc(task.success??"—")+' · Failed: '+esc(task.failure??"—")+'</div>'+
          (task.last_error?'<div class="error">'+esc(task.last_error)+'</div>':'')+
          (task.status==="delivery_sending"?'<div class="error">Delivery outcome is uncertain. Main Admin must check the customer chat before choosing an action.</div><div class="actions"><button class="btn secondary confirm-provider-delivered" data-task-id="'+Number(task.id)+'" type="button">Confirm file was delivered</button><button class="btn secondary retry-provider-delivery" data-task-id="'+Number(task.id)+'" type="button">Retry delivery (may duplicate)</button></div>':'')+(canPoll?'<button class="btn secondary poll-provider-task" data-task-id="'+Number(task.id)+'" type="button">Check status now</button>':'')+
        '</div>';
      }).join("")||'<p class="muted">No provider tasks yet.</p>';
      box.querySelectorAll(".poll-provider-task").forEach(button=>{
        button.onclick=async()=>{
          button.disabled=true;
          button.textContent="Checking…";
          try{
            await request("/api/admin/provider-tasks/poll","POST",{task_id:Number(button.dataset.taskId)});
            await loadProviderTasks();
          }catch(error){
            alert("Could not refresh task: "+error.message);
            button.disabled=false;
            button.textContent="Check status now";
          }
        };
      });
      box.querySelectorAll(".confirm-provider-delivered, .retry-provider-delivery").forEach(button=>{
        button.onclick=async()=>{
          const taskId=Number(button.dataset.taskId);
          const retry=button.classList.contains("retry-provider-delivery");
          const warning=retry
            ? "Only continue if you have independently confirmed the customer did NOT receive the result file. Retrying may send a duplicate if that check is wrong."
            : "Only continue if you have independently confirmed the result file is visible in the customer's Telegram chat. This marks the task completed without sending another file.";
          if(!confirm(warning)) return;
          const note=prompt(retry
            ? "Record how you confirmed the customer did not receive the file (minimum 8 characters):"
            : "Record how you confirmed the file was delivered (minimum 8 characters):");
          if(note===null) return;
          if(note.trim().length<8){
            alert("Please enter a review note of at least 8 characters.");
            return;
          }
          button.disabled=true;
          button.textContent=retry?"Retrying…":"Saving…";
          try{
            const result=await request("/api/admin/provider-tasks/delivery-review","POST",{
              task_id:taskId,
              action:retry?"retry_delivery":"confirm_delivered",
              note:note.trim()
            });
            if(retry){
              const outcome=(result.outcomes||[])[0];
              alert("Delivery review recorded. Current outcome: "+(outcome?.status||"pending")+". Refresh the task list to confirm its status.");
            }else{
              alert("Task marked completed based on your delivery confirmation.");
            }
            await loadProviderTasks();
          }catch(error){
            alert("Delivery review failed: "+error.message);
            button.disabled=false;
            button.textContent=retry?"Retry delivery (may duplicate)":"Confirm file was delivered";
          }
        };
      });
    }catch(error){
      message.textContent="Could not load provider tasks: "+error.message;
    }
  }

  const providerRefresh=document.getElementById("refresh-provider-tasks");
  if(providerRefresh)providerRefresh.onclick=loadProviderTasks;
  loadProviderTasks();

  const uploadRefreshButton=
    document.getElementById("refresh-admin-uploads");

  if(uploadRefreshButton){
    uploadRefreshButton.onclick=loadAdminUploads;
  }

  loadAdminUploads();

  document.getElementById("cn-validate-upload").onclick=async()=>{
    const fileInput=document.getElementById("cn-upload-file");
    const taskType=document.getElementById("cn-task-type").value;
    const resultBox=document.getElementById("cn-upload-result");
    const button=document.getElementById("cn-validate-upload");
    const file=fileInput.files&&fileInput.files[0];

    if(!file){
      resultBox.textContent="Please select a TXT or CSV file.";
      return;
    }

    if(!/\.(txt|csv)$/i.test(file.name)){
      resultBox.textContent="Only .txt and .csv files are allowed.";
      return;
    }

    if(file.size>2*1024*1024){
      resultBox.textContent="File is too large. Maximum size is 2 MB.";
      return;
    }

    const formData=new FormData();
    formData.append("file",file);
    formData.append("task_type",taskType);

    button.disabled=true;
    button.textContent="Validating…";
    resultBox.textContent="Uploading file for validation only…";

    try{
      const response=await fetch(API+"/api/admin/checknumber/validate-upload",{
        method:"POST",
        headers:{
          "Authorization":"Bearer "+token,
          "Accept":"application/json"
        },
        body:formData
      });

      const data=await response.json();

      if(!response.ok||!data.ok){
        throw new Error(data.error||"Upload validation failed ("+response.status+")");
      }

      resultBox.textContent=JSON.stringify(data,null,2);
    }catch(error){
      resultBox.textContent="Error: "+error.message;
    }finally{
      button.disabled=false;
      button.textContent="Validate File";
    }
  };

  if(adminServices.length){
    document.getElementById("price-service").value=adminServices[0].resource_code;
    document.getElementById("visibility-service").value=adminServices[0].resource_code;

    loadPricingEditor(adminServices[0].resource_code);

    document.getElementById("service-listed").checked=
      Number(adminServices[0].is_listed)===1;
  }

} // Correctly closes wireAdmin()

async function reloadAdmin(){
  const data=await request("/api/admin/catalogue");

  categories=data.categories||[];
  adminServices=data.services||[];

  renderDashboard();
}

login();

})();
</script>
