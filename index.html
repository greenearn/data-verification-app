<style>

*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,#081522,#07111d);color:var(--text);font:14px/1.5 system-ui,sans-serif}
button,input,select,textarea{font:inherit}

.brand small{display:block;color:var(--muted);font-size:10px}
.status,.pill{font-size:10px;border:1px solid rgba(84,224,193,.25);border-radius:30px;padding:5px 9px;color:var(--mint)}

h3{font-size:13px;margin:0 0 7px}
p{color:var(--muted);font-size:12px;margin:5px 0}
.nav{display:flex;gap:8px;overflow-x:auto;padding:13px 0}
.nav a{white-space:nowrap;text-decoration:none;color:#c4d5e1;background:#13283a;border:1px solid var(--line);padding:7px 11px;border-radius:25px;font-size:10px}
.panel,.service,.category{background:rgba(16,35,56,.86);border:1px solid var(--line);border-radius:15px;padding:15px;margin:11px 0}

.balance strong{display:block;font-size:30px;margin:5px 0}

button{cursor:pointer}
.btn{border:0;border-radius:10px;padding:11px 14px;background:linear-gradient(110deg,#5ce4c6,#39c8b4);color:#06201e;font-size:11px;font-weight:850;margin-top:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.secondary{background:#20364a;color:#e1edf5;border:1px solid var(--line)}
.danger{background:#48252e;color:#ffd9dd;border:1px solid #75404a}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1}

.success{color:var(--mint)}
.error{color:var(--red)}
.muted{color:var(--muted);font-size:11px}
.hidden{display:none!important}
.admin-label{color:var(--mint);font-size:10px;font-weight:900;letter-spacing:.15em}
.item{padding:12px 0;border-bottom:1px solid var(--line)}
.item-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item strong{font-size:12px}
.item small{display:block;color:var(--muted);font-size:10px}

.checkbox input{width:auto}
.loader{width:23px;height:23px;border:2px solid #34516b;border-top-color:var(--mint);border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}

@media(max-width:480px){.grid,.category-content{grid-template-columns:1fr}.wrap{padding:14px 12px 35px}.row{grid-template-columns:1fr}}

<body>
<div id="app"><div class="wrap"><div class="loader"></div><p>Connecting securely to Telegram…</p></div></div>

<script>
(function(){
"use strict";

const API="https://data-verification-api.shrestharaj980888.workers.dev";
const app=document.getElementById("app");
const tg=window.Telegram&&Telegram.WebApp?Telegram.WebApp:null;

let token="";
let user={};
let services=[];
let categories=[];
let selectedCode="";
let adminMode=false;

if(tg){
  tg.ready();
  tg.expand();
  if(tg.setHeaderColor)tg.setHeaderColor("#0b1220");
  if(tg.setBackgroundColor)tg.setBackgroundColor("#0b1220");
}

function esc(v){
  return String(v==null?"":v)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function money(cents,currency){
  return (Number(cents||0)/100).toFixed(2)+" "+(currency||"USDT");
}


async function request(path, method = "GET", body = null) {
  const options = {
    method,
    headers: {
      "Authorization": "Bearer " + token,
      "Accept": "application/json"
    }
  };

  if (body !== null) {
    if (body instanceof FormData) {
      options.body = body;
    } else {
      options.headers["Content-Type"] = "application/json";
      options.body = JSON.stringify(body);
    }
  }

  const response = await fetch(API + path, options);
  const data = await response.json();

  if (!response.ok || !data.ok) {
    throw new Error(data.error || "Request failed (" + response.status + ")");
  }

  return data;
}


function showError(message){
  app.innerHTML='<main class="wrap"><div class="panel"><h2>Connection problem</h2><p class="error">'+esc(message)+'</p><button class="btn" onclick="location.reload()">Try again</button></div></main>';
}

async function login(){
  if(!tg||!tg.initData){
    showError("Please open this Mini App from your Telegram bot.");
    return;
  }

  app.innerHTML='<main class="wrap"><div class="loader"></div><p>Verifying Telegram account…</p></main>';

  try{
    const response=await fetch(API+"/api/auth",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({initData:tg.initData})
    });

    const data=await response.json();

    if(!response.ok||!data.ok)throw new Error(data.error||"Login failed");

    token=data.token;

    const me=await request("/api/me");
    user=me.user||data.user||{};

    await loadCustomerServices();
    renderDashboard();

    try{
      const admin=await request("/api/admin/catalogue");
      categories=admin.categories||[];
      services=admin.services||services;
      adminMode=true;
      renderDashboard();
    }catch(error){
      adminMode=false;
    }

  }catch(error){
    showError(error.message||"Secure login failed.");
  }
}

async function loadCustomerServices(){
  const data=await request("/api/services");
  services=data.services||[];
}

function balanceText(){
  const cents=user.wallet_balance_cents??user.balance_cents??user.wallet_cents;
  if(cents===undefined||cents===null)return "Balance unavailable";
  return money(cents,"USDT");
}

function renderDashboard(){
  const name=user.first_name||"Customer";

  app.innerHTML=`
  <main class="wrap">
    <header>
      <div class="brand">
        <div class="logo">DV</div>
        <div><strong>DATA VERIFICATION</strong><small>SECURE CUSTOMER PORTAL</small></div>
      </div>
      <span class="status">SECURE SESSION</span>
    </header>

    <nav class="nav">
      <a href="#services">Services</a>
      <a href="#prepare">Prepare list</a>
      <a href="#orders">Orders</a>
      <a href="#account">Account</a>
      ${adminMode?'<a href="#admin">Admin dashboard</a>':""}
    </nav>

    <h1>Welcome, ${esc(name)}</h1>
    <p>Manage your validation services and account.</p>

    <section class="balance">
      <small>AVAILABLE WALLET BALANCE</small>
      <strong>${esc(balanceText())}</strong>
      <small>Account balance · USDT</small>
    </section>

    <section id="services">
      <div class="item-top"><h2>Service catalogue</h2><span class="pill">Database driven</span></div>
      <p id="catalogue-message">Services loaded from your database.</p>
      <div id="services-list"></div>
    </section>

    <section id="prepare" class="panel">
      <h2>Prepare your input list</h2>
      <p>Preview only. This does not submit data to the provider.</p>

      <label class="field" for="service-select">Select service</label>
      <select id="service-select"><option value="">Choose service</option></select>

      <label class="field" for="quantity">Quantity for price estimate</label>
      <input id="quantity" type="number" min="1" value="500">
<label class="field" for="customer-file">Upload your TXT or CSV file (maximum 20 MB)</label>
<input
  id="customer-file"
  type="file"
  accept=".txt,.csv,text/plain,text/csv"
>

<p class="note">
  Upload only data you are authorized to process.
  Uploading a file does not submit it to the provider or charge your wallet.
</p>

<button class="btn secondary" id="upload-file-button" type="button">
  Upload file
</button>

<div id="upload-file-result" class="note">
  No file uploaded.
</div>
      <label class="field" for="entries">Input list — one entry per line</label>
      <textarea id="entries" placeholder="Select a service first…"></textarea>

      <div class="actions">
        <button class="btn" id="preview-button">Review input</button>
        <button class="btn secondary" id="clear-button">Clear</button>
      </div>

      <div id="preview-result" class="note">No data has been submitted.</div>
      <div class="note">Ordering is disabled. This screen only prepares and reviews your input locally.</div>
    </section>

    <section id="orders" class="panel">
      <h2>Order history</h2>
      <p id="orders-message">Loading order history…</p>
      <div id="orders-list"></div>
      <button class="btn secondary" id="orders-refresh">Refresh history</button>
    </section>

    <section id="account" class="panel">
      <h2>Account details</h2>
      <div class="item"><small>Telegram ID</small><strong>${esc(user.telegram_id||"Verified")}</strong></div>
      <div class="item"><small>Username</small><strong>${esc(user.username?"@"+user.username:"Not set")}</strong></div>
      <button class="btn secondary" id="refresh-session">Refresh session</button>
    </section>

    ${adminMode?adminMarkup():""}

    <footer>Data Verification · Secure access · Authorized validation only.</footer>
  </main>`;

  renderServices();

  document.getElementById("service-select").addEventListener("change",function(){
    selectedCode=this.value;
    renderServices();
    updateEstimate();
  });

document.getElementById("upload-file-button").onclick = async () => {
  const fileInput = document.getElementById("customer-file");
  const resultBox = document.getElementById("upload-file-result");
  const file = fileInput.files[0];

  if (!selectedCode) {
    resultBox.textContent = "Please select a service first.";
    return;
  }

  if (!file) {
    resultBox.textContent = "Please choose a TXT or CSV file.";
    return;
  }
if (file.size > 20 * 1024 * 1024) {
  resultBox.textContent = "File must be smaller than 20 MB.";
  return;
}
  const form = new FormData();
  form.append("file", file);
  form.append("resource_code", selectedCode);

  resultBox.textContent = "Uploading file. Please wait...";

  try {
    const result = await request("/api/uploads", "POST", form);
    if (!result.ok) {
      throw new Error(result.error || "Upload failed");
    }

    resultBox.textContent =
      "File uploaded successfully. Upload ID: " + result.upload_id;

  } catch (error) {
    resultBox.textContent =
      "Upload failed: " + error.message;
  }
};

  document.getElementById("quantity").addEventListener("input",updateEstimate);
  document.getElementById("preview-button").onclick=previewInput;

  document.getElementById("clear-button").onclick=function(){
    document.getElementById("entries").value="";
    document.getElementById("preview-result").textContent="Input cleared.";
  };

  document.getElementById("orders-refresh").onclick=loadOrders;
  document.getElementById("refresh-session").onclick=refreshSession;

  loadOrders();
  updateEstimate();

  if(adminMode)wireAdmin();
}

function renderServices(){
  const box=document.getElementById("services-list");
  const select=document.getElementById("service-select");

  if(!box||!select)return;

  const groups={};

  services.forEach(s=>{
    const category=s.category||"Other Services";
    if(!groups[category])groups[category]=[];
    groups[category].push(s);
  });

  let html="";

  Object.keys(groups).forEach((category,index)=>{
    const items=groups[category];
    const open=index===0||items.some(s=>s.resource_code===selectedCode);

    html+=`<section class="category ${open?"open":""}">
      <button class="category-toggle" type="button">
        <span>${esc(category)} · ${items.length} services</span><span>⌄</span>
      </button>
      <div class="category-content">`;

    items.forEach(s=>{
      const selected=s.resource_code===selectedCode;
      const status=!s.configured?"Pricing not configured":
  !s.enabled?"Not active":
  !s.can_order?"Ordering unavailable":"Available";

const priceText = s.configured && s.unit_price_cents != null
  ? "Price: " + money(
      Math.ceil(
        Number(s.unit_price_cents) *
        Number(s.minimum_order_quantity) /
        Number(s.pricing_unit_quantity)
      ),
      s.currency
    ) + " / minimum order"
  : "Price not configured";

      html+=`<article class="service ${selected?"selected":""}" data-code="${esc(s.resource_code)}">
        <strong>${esc(s.name)}</strong>
        <p>${esc(s.description)}</p>
        <span class="pill">${esc(status)}</span>
        <p>Minimum quantity: ${s.minimum_order_quantity==null?"Not set":Number(s.minimum_order_quantity).toLocaleString()}</p>
        <p>${esc(priceText)}</p>
      </article>`;
    });

    html+="</div></section>";
  });

  box.innerHTML=html||'<div class="panel"><p>No services currently listed.</p></div>';

  select.innerHTML='<option value="">Choose service</option>'+
    services.map(s=>`<option value="${esc(s.resource_code)}">${esc(s.category)} — ${esc(s.name)}</option>`).join("");

  select.value=selectedCode;

  box.querySelectorAll(".category-toggle").forEach(button=>{
    button.onclick=()=>button.closest(".category").classList.toggle("open");
  });

  box.querySelectorAll("[data-code]").forEach(card=>{
    card.onclick=()=>{
      selectedCode=card.dataset.code;
      select.value=selectedCode;
      renderServices();
      updateEstimate();
    };
  });
}

function updateEstimate(){
  const box=document.getElementById("preview-result");
  const quantity=document.getElementById("quantity");

  if(!box||!quantity)return;

  const service=services.find(s=>s.resource_code===selectedCode);

  if(!service){
    box.textContent="Select a service to view its pricing.";
    return;
  }

  if(!service.configured||service.unit_price_cents==null||!service.pricing_unit_quantity){
    box.textContent="Pricing is not configured for this service.";
    return;
  }

  const amount=Number(quantity.value||0);
  const minimum=Number(service.minimum_order_quantity||0);

  if(!Number.isSafeInteger(amount)||amount<1){
    box.textContent="Enter a valid quantity.";
    return;
  }

  if(minimum&&amount<minimum){
    box.textContent="Minimum quantity is "+minimum.toLocaleString()+".";
    return;
  }

  const total=Math.ceil(Number(service.unit_price_cents)*amount/Number(service.pricing_unit_quantity));

  box.textContent="Estimated price: "+money(total,service.currency)+
    " · Quantity: "+amount.toLocaleString()+
    " · Estimate only; ordering is disabled.";
}

function previewInput(){
  const service=services.find(s=>s.resource_code===selectedCode);
  const result=document.getElementById("preview-result");
  const entries=document.getElementById("entries").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);

  if(!service){result.textContent="Please select a service first.";return;}
  if(!entries.length){result.textContent="Enter at least one item.";return;}

  const unique=new Set(entries);
  const duplicates=entries.length-unique.size;
  let valid=0;

  if(service.input_type==="email"){
    valid=entries.filter(x=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x)).length;
  }else{
    valid=entries.filter(x=>/^\+[1-9]\d{6,14}$/.test(x)).length;
  }

  result.textContent="Review complete. Entries: "+entries.length+
    " · Basic format valid: "+valid+
    " · Needs review: "+(entries.length-valid)+
    " · Duplicate entries: "+duplicates+
    ". Nothing was uploaded or ordered.";

  updateEstimate();
}

async function loadOrders(){
  const message=document.getElementById("orders-message");
  const list=document.getElementById("orders-list");

  if(!message||!list)return;

  message.textContent="Loading order history…";
  list.innerHTML="";

  try{
    const data=await request("/api/orders?limit=20&offset=0");
    const orders=data.orders||[];

    if(!orders.length){
      message.textContent="No orders found.";
      return;
    }

    message.textContent="Recent orders:";

    list.innerHTML=orders.map(o=>`
      <div class="item">
        <strong>Order #${esc(o.id)}</strong>
        <small>Service: ${esc(o.resource_code)} · Quantity: ${esc(o.quantity)}</small>
        <small>Status: ${esc(o.status)} · Charge: ${money(o.customer_charge_cents,o.currency)}</small>
      </div>`).join("");

  }catch(error){
    message.textContent="Could not load orders: "+error.message;
  }
}

async function refreshSession(){
  try{
    const data=await request("/api/me");
    user=data.user||user;
    renderDashboard();
  }catch(error){
    showError("Session expired. Please reopen the Mini App.");
  }
}

      >

      <div class="actions">
        <button class="btn" id="cn-validate-upload" type="button">
          Validate File
        </button>
      </div>

      <pre id="cn-upload-result" class="note muted" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre>
    </div>

    <div class="note">Safety: customer ordering, provider submissions, deposits, withdrawals and wallet deductions remain disabled.</div>
    <button class="btn secondary" id="reload-admin">Refresh admin catalogue</button>
    <div id="admin-message" class="muted"></div>
  </section>`;
}

function fillServiceDropdowns(){
  const options=services.map(s=>
    `<option value="${esc(s.resource_code)}">${esc(s.name)} (${esc(s.resource_code)})</option>`
  ).join("");

  ["admin-service-select","price-service","visibility-service"].forEach(id=>{
    const el=document.getElementById(id);

    if(el){
      el.innerHTML=(id==="admin-service-select"?'<option value="">Create a new service</option>':"")+options;
    }
  });

  const categorySelect=document.getElementById("svc-category");

  if(categorySelect){
    categorySelect.innerHTML=categories.map(c=>
      `<option value="${esc(c.category)}">${esc(c.category)}</option>`
    ).join("");
  }
}

function renderAdminCategories(){
  const box=document.getElementById("admin-categories");
  if(!box)return;

  box.innerHTML=categories.map(c=>`
    <div class="item" data-category="${esc(c.category)}">
      <div class="item-top">
        <strong>${esc(c.category)}</strong>
        <span class="pill">${Number(c.is_listed)===1?"Published":"Hidden"}</span>
      </div>
      <div class="row">
        <div>
          <label class="field">Rename category</label>
          <input class="rename-value" value="${esc(c.category)}" maxlength="80">
        </div>
        <div>
          <label class="field">Display order</label>
          <input class="order-value" type="number" min="0" value="${Number(c.display_order)||0}">
        </div>
      </div>
      <div class="actions">
        <button class="btn rename-button">Rename</button>
        <button class="btn secondary order-button">Save order</button>
        <button class="btn secondary visibility-button">${Number(c.is_listed)===1?"Hide":"Publish"}</button>
      </div>
    </div>`).join("")||'<p>No categories found.</p>';

  box.querySelectorAll("[data-category]").forEach(item=>{
    const category=item.dataset.category;

    item.querySelector(".rename-button").onclick=async()=>{
      const newName=item.querySelector(".rename-value").value.trim();

      if(!newName)return alert("Enter a category name.");
      if(newName===category)return alert("The category name is unchanged.");
      if(!confirm("Rename "+category+" to "+newName+"?"))return;

      await adminAction(async()=>{
        await request("/api/admin/categories","POST",{
          action:"rename",
          old_category:category,
          new_category:newName
        });

        await reloadAdmin();
      });
    };

    item.querySelector(".order-button").onclick=async()=>{
      const orderItems=[...box.querySelectorAll("[data-category]")];

      const ordered=orderItems.map(el=>({
        name:el.dataset.category,
        order:Number(el.querySelector(".order-value").value)
      }));

      if(ordered.some(x=>!Number.isSafeInteger(x.order)||x.order<0)){
        return alert("Enter valid display orders.");
      }

      ordered.sort((a,b)=>a.order-b.order);

      await adminAction(async()=>{
        await request("/api/admin/categories","POST",{
          action:"reorder",
          categories:ordered.map(x=>x.name)
        });

        await reloadAdmin();
      });
    };

    item.querySelector(".visibility-button").onclick=async()=>{
      const current=categories.find(c=>c.category===category);

      await adminAction(async()=>{
        await request("/api/admin/categories","POST",{
          action:"visibility",
          category,
          is_listed:Number(current.is_listed)===1?0:1
        });

        await reloadAdmin();
      });
    };
  });
}

function loadServiceEditor(code){
  const s=services.find(x=>x.resource_code===code);

  if(!s){
    document.getElementById("svc-code").value="";
    document.getElementById("svc-name").value="";
    document.getElementById("svc-description").value="";
    document.getElementById("svc-task").value="";
    document.getElementById("svc-order").value="100";
    document.getElementById("svc-input").value="phone";

    if(categories.length){
      document.getElementById("svc-category").value=categories[0].category;
    }

    return;
  }

  document.getElementById("svc-code").value=s.resource_code||"";
  document.getElementById("svc-name").value=s.name||"";
  document.getElementById("svc-description").value=s.description||"";
  document.getElementById("svc-task").value=s.task_type||"";
  document.getElementById("svc-order").value=s.display_order??100;
  document.getElementById("svc-input").value=s.input_type||"phone";
  document.getElementById("svc-category").value=s.category||"";
}

function loadPricingEditor(code){
  const s=services.find(x=>x.resource_code===code);
  if(!s)return;

  document.getElementById("provider-cost").value=s.provider_cost_cents??0;
  document.getElementById("pricing-unit").value=s.pricing_unit_quantity??10000;
  document.getElementById("markup-type").value=s.markup_type||"percentage";
  document.getElementById("markup-value").value=s.markup_value??0;
  document.getElementById("final-price").value=s.final_price_cents??"";
  document.getElementById("minimum-quantity").value=s.minimum_order_quantity??500;
  document.getElementById("currency").value=s.currency||"USDT";
  document.getElementById("pricing-enabled").checked=
    Number(s.pricing_enabled??s.enabled)===1||s.enabled===true;
}

async function adminAction(action){
  const message=document.getElementById("admin-message");

  if(message)message.textContent="Saving…";

  try{
    await action();
    if(message)message.textContent="Saved successfully.";
  }catch(error){
    if(message)message.textContent="Error: "+error.message;
  }
}

function wireAdmin(){
  renderAdminCategories();
  fillServiceDropdowns();

  document.getElementById("admin-service-select").onchange=e=>{
    loadServiceEditor(e.target.value);
  };

  document.getElementById("new-service").onclick=()=>{
    document.getElementById("admin-service-select").value="";
    loadServiceEditor("");
  };

  document.getElementById("price-service").onchange=e=>{
    loadPricingEditor(e.target.value);
  };

  document.getElementById("visibility-service").onchange=e=>{
    const s=services.find(x=>x.resource_code===e.target.value);
    document.getElementById("service-listed").checked=!!s&&Number(s.is_listed)===1;
  };

  document.getElementById("create-category").onclick=async()=>{
    const category=document.getElementById("new-category").value.trim();
    const display_order=Number(document.getElementById("new-category-order").value);

    if(!category)return alert("Enter a category name.");
    if(!Number.isSafeInteger(display_order)||display_order<0){
      return alert("Enter a valid display order.");
    }

    await adminAction(async()=>{
      await request("/api/admin/categories","POST",{
        action:"create",
        category,
        display_order
      });

      document.getElementById("new-category").value="";
      await reloadAdmin();
    });
  };

  document.getElementById("save-service").onclick=async()=>{
    const body={
      resource_code:document.getElementById("svc-code").value.trim(),
      name:document.getElementById("svc-name").value.trim(),
      description:document.getElementById("svc-description").value.trim(),
      category:document.getElementById("svc-category").value,
      input_type:document.getElementById("svc-input").value,
      task_type:document.getElementById("svc-task").value.trim(),
      display_order:Number(document.getElementById("svc-order").value)
    };

    if(!body.resource_code||!body.name||!body.category||!body.task_type){
      alert("Complete resource code, service name, category and provider task code.");
      return;
    }

    await adminAction(async()=>{
      await request("/api/admin/services","POST",body);

      document.getElementById("service-message").textContent="Service details saved.";

      await reloadAdmin();

      document.getElementById("admin-service-select").value=body.resource_code;
      loadServiceEditor(body.resource_code);
    });
  };

  document.getElementById("save-pricing").onclick=async()=>{
    const resource_code=document.getElementById("price-service").value;

    if(!resource_code)return alert("Select a service first.");

    const finalValue=document.getElementById("final-price").value;

    const body={
      resource_code,
      provider_cost_cents:Number(document.getElementById("provider-cost").value),
      markup_type:document.getElementById("markup-type").value,
      markup_value:Number(document.getElementById("markup-value").value),
      final_price_cents:finalValue===""?null:Number(finalValue),
      pricing_unit_quantity:Number(document.getElementById("pricing-unit").value),
      minimum_order_quantity:Number(document.getElementById("minimum-quantity").value),
      currency:document.getElementById("currency").value,
      enabled:document.getElementById("pricing-enabled").checked
    };

    await adminAction(async()=>{
      await request("/api/admin/pricing","POST",body);

      document.getElementById("pricing-message").textContent="Pricing saved.";

      await reloadAdmin();

      document.getElementById("price-service").value=resource_code;
      loadPricingEditor(resource_code);
    });
  };

  document.getElementById("save-visibility").onclick=async()=>{
    const resource_code=document.getElementById("visibility-service").value;

    if(!resource_code)return alert("Select a service.");

    const is_listed=document.getElementById("service-listed").checked?1:0;

    await adminAction(async()=>{
      await request("/api/admin/services/visibility","POST",{
        resource_code,
        is_listed
      });

      document.getElementById("visibility-message").textContent="Service visibility saved.";

      await reloadAdmin();

      document.getElementById("visibility-service").value=resource_code;

      const s=services.find(x=>x.resource_code===resource_code);

      document.getElementById("service-listed").checked=
        !!s&&Number(s.is_listed)===1;
    });
  };

  document.getElementById("reload-admin").onclick=()=>adminAction(reloadAdmin);

  // Admin-only file validation. Uses the same Bearer token as other API calls.
  // This endpoint validates the file only; it does not submit a provider task.
  document.getElementById("cn-validate-upload").onclick=async()=>{
    const fileInput=document.getElementById("cn-upload-file");
    const taskType=document.getElementById("cn-task-type").value;
    const resultBox=document.getElementById("cn-upload-result");
    const button=document.getElementById("cn-validate-upload");
    const file=fileInput.files&&fileInput.files[0];

    if(!file){
      resultBox.textContent="Please select a TXT or CSV file.";
      return;
    }

    if(!/\.(txt|csv)$/i.test(file.name)){
      resultBox.textContent="Only .txt and .csv files are allowed.";
      return;
    }

    if(file.size>2*1024*1024){
      resultBox.textContent="File is too large. Maximum size is 2 MB.";
      return;
    }

    const formData=new FormData();
    formData.append("file",file);
    formData.append("task_type",taskType);

    button.disabled=true;
    button.textContent="Validating…";
    resultBox.textContent="Uploading file for validation only…";

    try{
      const response=await fetch(API+"/api/admin/checknumber/validate-upload",{
        method:"POST",
        headers:{
          "Authorization":"Bearer "+token,
          "Accept":"application/json"
        },
        body:formData
      });

      const data=await response.json();

      if(!response.ok||!data.ok){
        throw new Error(data.error||"Upload validation failed ("+response.status+")");
      }

      resultBox.textContent=JSON.stringify(data,null,2);
    }catch(error){
      resultBox.textContent="Error: "+error.message;
    }finally{
      button.disabled=false;
      button.textContent="Validate File";
    }
  };

  if(services.length){
    document.getElementById("price-service").value=services[0].resource_code;
    document.getElementById("visibility-service").value=services[0].resource_code;

    loadPricingEditor(services[0].resource_code);

    document.getElementById("service-listed").checked=
      Number(services[0].is_listed)===1;
  }
}

async function reloadAdmin(){
  const data=await request("/api/admin/catalogue");

  categories=data.categories||[];
  services=data.services||[];

  renderDashboard();
}

login();
})();
</script>
</body>
</html>
