<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>Data Verification</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#07111d;--panel:#0d1b2b;--panel2:#102338;--line:rgba(151,181,207,.14);--text:#edf6fb;--muted:#8fa6b9;--mint:#54e0c1;--mint2:#1db99f;--blue:#80baff;--gold:#e8c88b;--danger:#ff8791}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% -12%,rgba(34,112,119,.24),transparent 38%),radial-gradient(ellipse at 100% 4%,rgba(39,91,145,.19),transparent 32%),linear-gradient(180deg,#081522 0%,#07111d 55%,#091522 100%);color:var(--text);font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.01em}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(rgba(145,177,199,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(145,177,199,.055) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 72%)}
button,input,textarea{font:inherit}
.wrap{position:relative;max-width:820px;margin:auto;padding:25px 19px 48px}
.top,.brand,.head{display:flex;align-items:center;justify-content:space-between;gap:14px}
.top{padding:3px 2px 19px;border-bottom:1px solid var(--line)}
.brand{justify-content:flex-start;min-width:0}
.logo{width:44px;height:44px;flex:0 0 44px;border:1px solid rgba(84,224,193,.38);border-radius:15px;background:linear-gradient(145deg,rgba(84,224,193,.22),rgba(48,118,153,.22));display:grid;place-items:center;color:var(--mint);font-size:14px;font-weight:850;letter-spacing:-.06em;box-shadow:inset 0 1px rgba(255,255,255,.08),0 8px 24px rgba(0,0,0,.2)}
.brand strong{display:block;font-size:12px;letter-spacing:.14em;font-weight:800;white-space:nowrap}
.brand small,.muted{color:var(--muted);font-size:11px}
.brand small{display:block;letter-spacing:.12em;margin-top:2px}
.status,.tag{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.07em;border:1px solid rgba(84,224,193,.25);border-radius:30px;padding:6px 10px;color:var(--mint);background:rgba(38,150,128,.08);white-space:nowrap}
.welcome{margin:29px 0 17px}
.eyebrow{color:var(--mint);text-transform:uppercase;letter-spacing:.17em;font-size:10px;font-weight:800}
.welcome h1{font-size:clamp(25px,5vw,32px);line-height:1.16;letter-spacing:-.045em;margin:8px 0 7px;font-weight:760}
.welcome p,.panel p{color:var(--muted);font-size:12px;margin:0}
.balance{position:relative;overflow:hidden;background:linear-gradient(112deg,rgba(22,71,79,.92),rgba(16,43,65,.96) 60%,rgba(16,38,61,.98));border:1px solid rgba(84,224,193,.25);border-radius:21px;padding:21px 22px;margin:20px 0 29px;box-shadow:0 18px 42px rgba(0,0,0,.18),inset 0 1px rgba(255,255,255,.045)}
.balance:after{content:"";position:absolute;width:190px;height:190px;border:1px solid rgba(84,224,193,.13);border-radius:50%;right:-70px;top:-100px;box-shadow:0 0 0 22px rgba(84,224,193,.025),0 0 0 45px rgba(84,224,193,.02)}
.balance .muted{font-size:10px;letter-spacing:.13em;font-weight:750;color:#b2d1d1}
.amount{position:relative;z-index:1;font-size:clamp(29px,6vw,37px);font-weight:780;letter-spacing:-.045em;margin:7px 0 3px;font-variant-numeric:tabular-nums}
.amount span{font-size:12px;letter-spacing:.08em;color:#b8d8d8}
.head{margin:27px 1px 12px}
.head h2{font-size:14px;letter-spacing:-.015em;margin:0;font-weight:730}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.service,.panel{background:linear-gradient(145deg,rgba(16,34,52,.96),rgba(11,27,43,.98));border:1px solid var(--line);border-radius:17px;box-shadow:0 10px 28px rgba(0,0,0,.12)}
.service{min-height:145px;padding:17px;transition:border-color .2s,transform .2s,background .2s}
.service:hover{border-color:rgba(84,224,193,.3);transform:translateY(-2px);background:linear-gradient(145deg,#112b3e,#0c1d30)}
.ico{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:rgba(84,224,193,.09);border:1px solid rgba(84,224,193,.15);font-size:18px;color:var(--mint);margin-bottom:12px}
.service strong,.panel h3{font-size:12px;font-weight:750;letter-spacing:.005em}
.service p{font-size:11px;color:var(--muted);margin:5px 0 12px;line-height:1.5}
.tag{font-size:9px;padding:4px 8px;letter-spacing:.06em;color:#b5c8d8;border-color:var(--line);background:rgba(255,255,255,.025)}
.panel{padding:17px;margin-top:11px}
.panel h3{margin:0 0 5px}
.panel p{font-size:11px;line-height:1.6}
.field{display:block;font-size:11px;font-weight:700;letter-spacing:.025em;margin:14px 0 7px;color:#c6d8e5}
textarea,input[type=file]{width:100%;background:rgba(4,15,27,.72);border:1px solid rgba(142,174,200,.2);border-radius:12px;padding:12px 13px;color:var(--text);font:12px/1.5 inherit;outline:none;transition:border-color .2s,box-shadow .2s}
textarea:focus,input[type=file]:focus{border-color:rgba(84,224,193,.55);box-shadow:0 0 0 3px rgba(84,224,193,.08)}
textarea{min-height:116px;resize:vertical}
textarea::placeholder{color:#627b91}
.btn{width:100%;padding:12px 15px;border:1px solid transparent;border-radius:11px;background:linear-gradient(110deg,#5ce4c6,#39c8b4);color:#06201e;font-size:12px;font-weight:800;letter-spacing:.02em;margin-top:11px;cursor:pointer;box-shadow:0 7px 18px rgba(42,190,164,.12);transition:filter .2s,transform .2s}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.secondary{background:rgba(128,166,194,.09);border-color:rgba(142,174,200,.17);color:#d9e8f2;box-shadow:none}
.notice,.info{border-radius:11px;padding:11px 12px;font-size:10px;line-height:1.55;margin-top:13px}
.notice{border:1px solid rgba(232,200,139,.2);background:rgba(115,83,31,.13);color:#e6d1a7}
.info{border:1px solid rgba(128,186,255,.19);background:rgba(36,82,126,.13);color:#bdd8f0}
.check{display:flex;gap:10px;font-size:11px;line-height:1.5;margin:14px 0 4px;color:#c4d5e1}
.check input{accent-color:var(--mint);margin-top:2px}
.bottom{border-top:1px solid var(--line);margin-top:28px;padding-top:16px;text-align:center;color:#6f879b;font-size:10px;letter-spacing:.025em}
.login{max-width:440px;margin:12vh auto;background:linear-gradient(145deg,#102338,#0b1b2b);border:1px solid var(--line);border-radius:21px;padding:25px;box-shadow:0 22px 60px rgba(0,0,0,.28)}
.error{color:var(--danger);font-size:12px}
.loader{width:26px;height:26px;border:2px solid #34516b;border-top-color:var(--mint);border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:520px){.wrap{padding:17px 13px 36px}.top{padding-bottom:15px}.brand strong{font-size:10px}.brand small{font-size:9px}.logo{width:40px;height:40px;flex-basis:40px}.status{font-size:9px;padding:5px 8px}.welcome{margin-top:25px}.grid{gap:9px}.service{padding:13px;min-height:150px}.panel{padding:14px}.balance{padding:19px;margin-bottom:25px}}
@media(max-width:360px){.status{font-size:8px}.brand strong{letter-spacing:.09em}.grid{grid-template-columns:1fr}.service{min-height:0}}
</style></head><body><div id="app"><div class="login"><div class="loader"></div><p class="muted">Connecting securely to Telegram…</p></div></div>
<script>
(function(){
"use strict";
const API="https://data-verification-api.shrestharaj980888.workers.dev",app=document.getElementById("app"),tg=window.Telegram&&Telegram.WebApp?Telegram.WebApp:null;let token="",user=null;
if(tg){tg.ready();tg.expand();if(tg.setHeaderColor)tg.setHeaderColor("#0b1220");if(tg.setBackgroundColor)tg.setBackgroundColor("#0b1220");}
function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function fail(msg){app.innerHTML='<div class="login"><div class="logo">DV</div><h2>Secure login needed</h2><p class="muted">'+esc(msg)+'</p><button class="btn secondary" id="retry">Try again</button></div>';document.getElementById("retry").onclick=login;}
async function login(){if(!tg||!tg.initData){fail("Open this page inside Telegram using the bot button.");return;}app.innerHTML='<div class="login"><div class="loader"></div><p class="muted">Verifying your Telegram account…</p></div>';try{const r=await fetch(API+"/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData:tg.initData})});const d=await r.json();if(!r.ok||!d.ok){fail(d.error||"Authentication failed.");return;}token=d.token;
const mr=await fetch(API+"/api/me",{method:"GET",headers:{"Authorization":"Bearer "+token}});
const md=await mr.json();
if(!mr.ok||!md.ok){token="";fail("Login succeeded, but the customer session could not be verified. Please try again.");return;}
user=md.user||d.user||{};
dashboard();}catch(e){fail("Could not reach the secure server. Check your connection.");}}
async function refreshSession(){
if(!token){login();return;}
try{
const r=await fetch(API+"/api/me",{method:"GET",headers:{"Authorization":"Bearer "+token}});
const d=await r.json();
if(!r.ok||!d.ok){token="";fail("Your session has expired. Please log in again.");return;}
user=d.user||user;
dashboard();
}catch(e){fail("Could not refresh your secure session. Check your connection.");}
}
function dashboard(){const name=user.first_name||"Customer";app.innerHTML='<main class="wrap"><header class="top"><div class="brand"><div class="logo">DV</div><div><strong>DATA VERIFICATION</strong><small>SECURE CUSTOMER PORTAL</small></div></div><span class="status">● SECURE SESSION</span></header><section class="welcome"><div class="eyebrow">Your secure workspace</div><h1>Welcome, '+esc(name)+'</h1><p>Manage your verification services and orders.</p></section><section class="balance"><div class="muted">AVAILABLE WALLET BALANCE</div><div class="amount">$'+(Number(user.wallet_balance_cents||0)/100).toFixed(2)+' <span style="font-size:14px">USDT</span></div><div class="muted">Your account balance · 1 USD = 1 USDT</div></section><div class="head"><h2>Verification services</h2><span class="muted">Choose a service</span></div><section class="grid"><article class="service"><div class="ico">✓</div><strong>Phone Number Validation</strong><p>Check number format and supported line details.</p><span class="tag">Coming online soon</span></article><article class="service"><div class="ico">♧</div><strong>Consent-based Verification</strong><p>Workflows for people who explicitly agreed.</p><span class="tag">Coming online soon</span></article></section><div class="head"><h2>Prepare a validation file</h2><span class="muted">TXT · one number per line</span></div><section class="panel"><h3>Phone number list</h3><p>Use international format with country code, e.g. +97798XXXXXXXX.</p><label class="field" for="file">Upload TXT file</label><input id="file" type="file" accept=".txt,text/plain"><label class="field" for="numbers">Or paste phone numbers</label><textarea id="numbers" placeholder="+9779812345678&#10;+14155552671"></textarea><p id="filemsg" class="muted">Maximum 100,000 non-empty lines.</p><button class="btn secondary" id="check">Check file format</button><div id="result" class="muted"></div><div class="notice">Preparation only: numbers stay in this page. They are not uploaded or submitted. Live validation will be enabled after the secure order API is completed.</div></section><div class="head"><h2>Consent-based verification</h2></div><section class="panel"><h3>Consent requirement</h3><p>Only request verification for your own number or a person who has explicitly agreed.</p><label class="check"><input type="checkbox" id="consent"><span>I confirm that the person whose number is submitted has explicitly consented, or the number is my own.</span></label><div class="info" id="consentmsg">This is a local acknowledgement only. Server-side consent recording must be connected before launch.</div></section><div class="head"><h2>Orders & activity</h2></div><section class="panel"><h3>Order history</h3><p>Submitted orders and completed results will appear here after the order API is connected.</p><span class="tag">Order API not connected</span></section><section class="panel"><h3>Account details</h3><p>Telegram ID: <b>'+esc(user.telegram_id||"Verified")+'</b><br>Username: <b>'+esc(user.username?"@"+user.username:"Not set")+'</b></p><button class="btn secondary" id="refresh">Refresh secure session</button></section><footer class="bottom">Data Verification · Secure access · Use services only with proper authorization and consent.</footer></main>';
document.getElementById("file").onchange=async function(){const f=this.files&&this.files[0];if(!f)return;if(!f.name.toLowerCase().endsWith(".txt")){document.getElementById("filemsg").textContent="Please select a .txt file.";return;}try{document.getElementById("numbers").value=await f.text();document.getElementById("filemsg").textContent="Loaded "+f.name;}catch(e){document.getElementById("filemsg").textContent="Could not read file.";}};document.getElementById("check").onclick=preview;document.getElementById("consent").onchange=function(){document.getElementById("consentmsg").textContent=this.checked?"Acknowledgement selected locally; it has not been sent to the server.":"Please confirm consent before requesting verification.";};document.getElementById("refresh").onclick=refreshSession;}
function preview(){const lines=document.getElementById("numbers").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),out=document.getElementById("result");if(!lines.length){out.textContent="Add at least one number first.";return;}if(lines.length>100000){out.textContent="Maximum 100,000 entries. Found "+lines.length+".";return;}const good=lines.filter(x=>/^\+[1-9]\d{6,14}$/.test(x)).length;out.innerHTML="<b>"+lines.length+"</b> entries · <span style='color:#54d6a1'>"+good+" valid international formats</span> · "+(lines.length-good)+" need correction. No numbers were uploaded.";}
login();
})();
</script></body></html>
