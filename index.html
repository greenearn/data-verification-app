<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>Data Verification</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111c2e;--line:#263a54;--text:#edf4ff;--muted:#91a4bd;--accent:#37d6bd;--blue:#6ba8ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% -10%,#173b50,transparent 42%),var(--bg);color:var(--text);font:15px/1.5 system-ui,Arial}.wrap{max-width:760px;margin:auto;padding:20px 16px 40px}.top,.brand,.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{justify-content:flex-start}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#37d6bd,#247ca4);display:grid;place-items:center;color:#06141d;font-weight:900}.brand strong{display:block;font-size:15px}.brand small,.muted{color:var(--muted);font-size:11px}.status,.tag{font-size:10px;border:1px solid #28634f;border-radius:30px;padding:5px 9px;color:#54d6a1}.welcome{margin:25px 0 16px}.eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:1.4px;font-size:10px;font-weight:800}.welcome h1{font-size:27px;line-height:1.2;margin:6px 0}.welcome p,.panel p{color:var(--muted);font-size:12px}.balance{background:linear-gradient(120deg,#163b48,#142a42);border:1px solid #28616b;border-radius:20px;padding:20px;margin:18px 0}.amount{font-size:32px;font-weight:800;margin:5px 0}.head{margin:25px 0 10px}.head h2{font-size:16px;margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.service,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px}.service{min-height:130px}.ico{font-size:20px;color:var(--accent);margin-bottom:8px}.service strong,.panel h3{font-size:13px}.service p{font-size:11px;color:var(--muted)}.tag{display:inline-block;border-color:#3a4b63;color:#b7c6d9}.panel{margin-top:12px}.panel h3{margin:0}.panel p{margin:5px 0 12px}.field{display:block;font-size:12px;margin:12px 0 5px;color:#c5d3e5}textarea,input[type=file]{width:100%;background:#0b1525;border:1px solid #2b405b;border-radius:11px;padding:12px;color:var(--text);font:13px system-ui}textarea{min-height:120px}.btn{width:100%;padding:12px;border:0;border-radius:11px;background:var(--accent);color:#06201e;font-weight:800;margin-top:10px}.secondary{background:#23364d;color:#edf4ff}.notice,.info{border-radius:11px;padding:11px;font-size:11px;margin-top:12px}.notice{border:1px solid #6b5730;background:#342b19;color:#f3dca8}.info{border:1px solid #294a69;background:#142b43;color:#bfd9f4}.check{display:flex;gap:9px;font-size:12px;margin:14px 0}.check input{accent-color:var(--accent)}.bottom{border-top:1px solid var(--line);margin-top:25px;padding-top:14px;text-align:center;color:#71859f;font-size:10px}.login{max-width:460px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px}.error{color:#ff737e;font-size:12px}.loader{width:25px;height:25px;border:3px solid #34516b;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:420px){.wrap{padding:15px 12px}.welcome h1{font-size:24px}.grid{gap:8px}.service{padding:12px}}
</style></head><body><div id="app"><div class="login"><div class="loader"></div><p class="muted">Connecting securely to Telegram…</p></div></div>
<script>
(function(){
"use strict";
const API="https://data-verification-api.shrestharaj980888.workers.dev",app=document.getElementById("app"),tg=window.Telegram&&Telegram.WebApp?Telegram.WebApp:null;let token="",user=null;
if(tg){tg.ready();tg.expand();if(tg.setHeaderColor)tg.setHeaderColor("#0b1220");if(tg.setBackgroundColor)tg.setBackgroundColor("#0b1220");}
function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function fail(msg){app.innerHTML='<div class="login"><div class="logo">DV</div><h2>Secure login needed</h2><p class="muted">'+esc(msg)+'</p><button class="btn secondary" id="retry">Try again</button></div>';document.getElementById("retry").onclick=login;}
async function login(){if(!tg||!tg.initData){fail("Open this page inside Telegram using the bot button.");return;}app.innerHTML='<div class="login"><div class="loader"></div><p class="muted">Verifying your Telegram account…</p></div>';try{const r=await fetch(API+"/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData:tg.initData})});const d=await r.json();if(!r.ok||!d.ok){fail(d.error||"Authentication failed.");return;}token=d.token;
const mr=await fetch(API+"/api/me",{method:"GET",headers:{"Authorization":"Bearer "+token}});
const md=await mr.json();
if(!mr.ok||!md.ok){token="";fail("Login succeeded, but the customer session could not be verified. Please try again.");return;}
user=md.user||d.user||{};
dashboard();}catch(e){fail("Could not reach the secure server. Check your connection.");}}
async function refreshSession(){
if(!token){login();return;}
try{
const r=await fetch(API+"/api/me",{method:"GET",headers:{"Authorization":"Bearer "+token}});
const d=await r.json();
if(!r.ok||!d.ok){token="";fail("Your session has expired. Please log in again.");return;}
user=d.user||user;
dashboard();
}catch(e){fail("Could not refresh your secure session. Check your connection.");}
}
function dashboard(){const name=user.first_name||"Customer";app.innerHTML='<main class="wrap"><header class="top"><div class="brand"><div class="logo">DV</div><div><strong>DATA VERIFICATION</strong><small>SECURE CUSTOMER PORTAL</small></div></div><span class="status">● SECURE SESSION</span></header><section class="welcome"><div class="eyebrow">Customer dashboard</div><h1>Welcome, '+esc(name)+'</h1><p>Manage your verification services and orders.</p></section><section class="balance"><div class="muted">AVAILABLE WALLET BALANCE</div><div class="amount">$'+(Number(user.wallet_balance_cents||0)/100).toFixed(2)+' <span style="font-size:14px">USDT</span></div><div class="muted">Your account balance · 1 USD = 1 USDT</div></section><div class="head"><h2>Verification services</h2><span class="muted">Choose a service</span></div><section class="grid"><article class="service"><div class="ico">✓</div><strong>Phone Number Validation</strong><p>Check number format and supported line details.</p><span class="tag">Coming online soon</span></article><article class="service"><div class="ico">♧</div><strong>Consent-based Verification</strong><p>Workflows for people who explicitly agreed.</p><span class="tag">Coming online soon</span></article></section><div class="head"><h2>Prepare a validation file</h2><span class="muted">TXT · one number per line</span></div><section class="panel"><h3>Phone number list</h3><p>Use international format with country code, e.g. +97798XXXXXXXX.</p><label class="field" for="file">Upload TXT file</label><input id="file" type="file" accept=".txt,text/plain"><label class="field" for="numbers">Or paste phone numbers</label><textarea id="numbers" placeholder="+9779812345678&#10;+14155552671"></textarea><p id="filemsg" class="muted">Maximum 100,000 non-empty lines.</p><button class="btn secondary" id="check">Check file format</button><div id="result" class="muted"></div><div class="notice">Preparation only: numbers stay in this page. They are not uploaded or submitted. Live validation will be enabled after the secure order API is completed.</div></section><div class="head"><h2>Consent-based verification</h2></div><section class="panel"><h3>Consent requirement</h3><p>Only request verification for your own number or a person who has explicitly agreed.</p><label class="check"><input type="checkbox" id="consent"><span>I confirm that the person whose number is submitted has explicitly consented, or the number is my own.</span></label><div class="info" id="consentmsg">This is a local acknowledgement only. Server-side consent recording must be connected before launch.</div></section><div class="head"><h2>Orders & activity</h2></div><section class="panel"><h3>Order history</h3><p>Submitted orders and completed results will appear here after the order API is connected.</p><span class="tag">Order API not connected</span></section><section class="panel"><h3>Account details</h3><p>Telegram ID: <b>'+esc(user.telegram_id||"Verified")+'</b><br>Username: <b>'+esc(user.username?"@"+user.username:"Not set")+'</b></p><button class="btn secondary" id="refresh">Refresh secure session</button></section><footer class="bottom">Data Verification · Secure access · Use services only with proper authorization and consent.</footer></main>';
document.getElementById("file").onchange=async function(){const f=this.files&&this.files[0];if(!f)return;if(!f.name.toLowerCase().endsWith(".txt")){document.getElementById("filemsg").textContent="Please select a .txt file.";return;}try{document.getElementById("numbers").value=await f.text();document.getElementById("filemsg").textContent="Loaded "+f.name;}catch(e){document.getElementById("filemsg").textContent="Could not read file.";}};document.getElementById("check").onclick=preview;document.getElementById("consent").onchange=function(){document.getElementById("consentmsg").textContent=this.checked?"Acknowledgement selected locally; it has not been sent to the server.":"Please confirm consent before requesting verification.";};document.getElementById("refresh").onclick=refreshSession;}
function preview(){const lines=document.getElementById("numbers").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),out=document.getElementById("result");if(!lines.length){out.textContent="Add at least one number first.";return;}if(lines.length>100000){out.textContent="Maximum 100,000 entries. Found "+lines.length+".";return;}const good=lines.filter(x=>/^\+[1-9]\d{6,14}$/.test(x)).length;out.innerHTML="<b>"+lines.length+"</b> entries · <span style='color:#54d6a1'>"+good+" valid international formats</span> · "+(lines.length-good)+" need correction. No numbers were uploaded.";}
login();
})();
</script></body></html>
