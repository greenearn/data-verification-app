
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Data Verification</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#07111d;--panel:#0d1b2b;--line:rgba(151,181,207,.14);--text:#edf6fb;--muted:#8fa6b9;--mint:#54e0c1;--danger:#ff8791}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% -12%,rgba(34,112,119,.24),transparent 38%),radial-gradient(ellipse at 100% 4%,rgba(39,91,145,.19),transparent 32%),linear-gradient(180deg,#081522,#07111d 55%,#091522);color:var(--text);font:14px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.01em}
button,input,textarea,select{font:inherit}
.wrap{position:relative;max-width:820px;margin:auto;padding:25px 19px 48px}
.top,.brand,.head{display:flex;align-items:center;justify-content:space-between;gap:14px}
.top{padding:3px 2px 19px;border-bottom:1px solid var(--line)}
.brand{justify-content:flex-start;min-width:0}
.logo{width:44px;height:44px;flex:0 0 44px;border:1px solid rgba(84,224,193,.38);border-radius:15px;background:linear-gradient(145deg,rgba(84,224,193,.22),rgba(48,118,153,.22));display:grid;place-items:center;color:var(--mint);font-size:14px;font-weight:850}
.brand strong{display:block;font-size:12px;letter-spacing:.14em;font-weight:800}
.brand small,.muted{color:var(--muted);font-size:11px}
.brand small{display:block;letter-spacing:.12em;margin-top:2px}
.status,.tag{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.07em;border:1px solid rgba(84,224,193,.25);border-radius:30px;padding:6px 10px;color:var(--mint);background:rgba(38,150,128,.08);white-space:nowrap}
.welcome{margin:29px 0 17px}
.eyebrow{color:var(--mint);text-transform:uppercase;letter-spacing:.17em;font-size:10px;font-weight:800}
.welcome h1{font-size:clamp(25px,5vw,32px);line-height:1.16;letter-spacing:-.045em;margin:8px 0 7px}
.welcome p,.panel p{color:var(--muted);font-size:12px;margin:0}
.balance{position:relative;overflow:hidden;background:linear-gradient(112deg,rgba(22,71,79,.92),rgba(16,43,65,.96) 60%,rgba(16,38,61,.98));border:1px solid rgba(84,224,193,.25);border-radius:21px;padding:21px 22px;margin:20px 0 29px}
.balance .muted{font-size:10px;letter-spacing:.13em;font-weight:750;color:#b2d1d1}
.amount{font-size:clamp(29px,6vw,37px);font-weight:780;letter-spacing:-.045em;margin:7px 0 3px}
.balance-meta{display:flex;justify-content:space-between;gap:10px;margin-top:13px;padding-top:12px;border-top:1px solid rgba(190,230,225,.13);font-size:10px;color:#b6d1d5}
.balance-meta strong{display:block;color:#e9f7f5;font-size:11px;margin-top:2px}
.head{margin:27px 1px 12px}
.head h2{font-size:14px;margin:0;font-weight:730}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.service,.panel{background:linear-gradient(145deg,rgba(16,34,52,.96),rgba(11,27,43,.98));border:1px solid var(--line);border-radius:17px}
.service{min-height:145px;padding:17px;cursor:pointer;transition:border-color .2s,transform .2s}
.service:hover{border-color:rgba(84,224,193,.3);transform:translateY(-2px)}
.service.selected{border-color:rgba(84,224,193,.65);background:linear-gradient(145deg,#123344,#0c2032)}
.ico{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:rgba(84,224,193,.09);border:1px solid rgba(84,224,193,.15);font-size:18px;color:var(--mint);margin-bottom:12px}
.service strong,.panel h3{font-size:12px;font-weight:750}
.service p{font-size:11px;color:var(--muted);margin:5px 0 12px;line-height:1.5}
.tag{font-size:9px;padding:4px 8px;color:#b5c8d8;border-color:var(--line);background:rgba(255,255,255,.025)}
.category-title{grid-column:1/-1;color:var(--mint);font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;padding:12px 2px 0;border-bottom:1px solid var(--line);padding-bottom:9px}
.service-status{font-size:10px;color:var(--muted);margin-top:9px}
.panel{padding:17px;margin-top:11px}
.panel h3{margin:0 0 5px}
.panel p{font-size:11px;line-height:1.6}
.field{display:block;font-size:11px;font-weight:700;margin:14px 0 7px;color:#c6d8e5}
textarea,input[type=file],input[type=number],select{width:100%;background:rgba(4,15,27,.72);border:1px solid rgba(142,174,200,.2);border-radius:12px;padding:12px 13px;color:var(--text);font:12px/1.5 inherit;outline:none}
textarea:focus,input:focus,select:focus{border-color:rgba(84,224,193,.55);box-shadow:0 0 0 3px rgba(84,224,193,.08)}
textarea{min-height:116px;resize:vertical}
textarea::placeholder{color:#627b91}
select option{background:#102338;color:white}
.btn{width:100%;padding:12px 15px;border:1px solid transparent;border-radius:11px;background:linear-gradient(110deg,#5ce4c6,#39c8b4);color:#06201e;font-size:12px;font-weight:800;margin-top:11px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.secondary{background:rgba(128,166,194,.09);border-color:rgba(142,174,200,.17);color:#d9e8f2}
.notice,.info{border-radius:11px;padding:11px 12px;font-size:10px;line-height:1.55;margin-top:13px}
.notice{border:1px solid rgba(232,200,139,.2);background:rgba(115,83,31,.13);color:#e6d1a7}
.info{border:1px solid rgba(128,186,255,.19);background:rgba(36,82,126,.13);color:#bdd8f0}
.check{display:flex;gap:10px;font-size:11px;line-height:1.5;margin:14px 0 4px;color:#c4d5e1}
.check input{accent-color:var(--mint);margin-top:2px}
.bottom{border-top:1px solid var(--line);margin-top:28px;padding-top:16px;text-align:center;color:#6f879b;font-size:10px}
.login{max-width:440px;margin:12vh auto;background:linear-gradient(145deg,#102338,#0b1b2b);border:1px solid var(--line);border-radius:21px;padding:25px}
.error{color:var(--danger);font-size:12px}
.loader{width:26px;height:26px;border:2px solid #34516b;border-top-color:var(--mint);border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.navlinks{display:flex;gap:8px;overflow-x:auto;padding:13px 1px 2px}
.navlinks a{flex:0 0 auto;text-decoration:none;color:#b8cbd9;background:rgba(132,169,195,.07);border:1px solid var(--line);padding:7px 11px;border-radius:30px;font-size:10px;font-weight:700}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 5px}
.step{padding:11px 10px;border:1px solid var(--line);border-radius:13px;background:rgba(11,27,43,.65)}
.step b{display:block;color:var(--mint);font-size:10px;margin-bottom:4px}
.step span{display:block;color:#a8bdcc;font-size:10px;line-height:1.4}
.panel-title{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.panel-icon{width:30px;height:30px;display:grid;place-items:center;border-radius:10px;background:rgba(84,224,193,.09);color:var(--mint);border:1px solid rgba(84,224,193,.15);font-size:14px;flex:0 0 30px}
.field-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.counter{font-size:10px;color:var(--muted)}
.action-row{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center}
.action-row .btn{margin-top:10px}
.clear-btn{border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.035);color:#b9cbd8;padding:10px 13px;font-size:11px;font-weight:700;cursor:pointer;margin-top:10px}
.result-card{display:none;margin-top:12px;padding:12px;border-radius:12px;border:1px solid rgba(84,224,193,.2);background:rgba(35,123,105,.09);color:#cde8df;font-size:11px;line-height:1.6}
.result-card.show{display:block}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}
.result-stat{background:rgba(4,15,27,.45);border-radius:9px;padding:8px}
.result-stat b{display:block;font-size:15px;color:#effaf6}
.result-stat span{font-size:9px;color:#a2b8c4}
.account-line{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:11px}
.account-line span{color:var(--muted)}
.account-line b{font-weight:650;overflow-wrap:anywhere;text-align:right}
.order-item{padding:13px;margin-top:10px;border:1px solid var(--line);border-radius:13px;background:rgba(4,15,27,.38)}
.order-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.order-id{font-size:11px;font-weight:750;color:#e8f4f8;overflow-wrap:anywhere}
.order-status{font-size:9px;font-weight:800;text-transform:uppercase;border:1px solid rgba(84,224,193,.2);border-radius:20px;padding:4px 8px;color:var(--mint)}
.order-details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.order-detail{padding:8px;border-radius:9px;background:rgba(255,255,255,.025);min-width:0}
.order-detail span{display:block;color:var(--muted);font-size:9px;margin-bottom:3px}
.order-detail b{display:block;color:#e4eef4;font-size:11px;overflow-wrap:anywhere}
.order-result{margin-top:9px;padding:9px;border-radius:9px;background:rgba(84,224,193,.06);font-size:10px;color:#bfe6da;overflow-wrap:anywhere}
.order-date{font-size:9px;color:var(--muted);margin-top:8px}
.orders-message{font-size:11px;color:var(--muted);line-height:1.6;margin:12px 0}
.orders-message.error{color:var(--danger)}
.price-box{margin-top:12px;padding:13px;border:1px solid rgba(84,224,193,.2);border-radius:12px;background:rgba(35,123,105,.08)}
.price-line{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:11px;color:#b9cbd8}
.price-line strong{color:#effaf6;text-align:right}
.price-total{border-top:1px solid var(--line);margin-top:7px;padding-top:10px;font-size:12px}
@media(max-width:520px){.wrap{padding:17px 13px 36px}.brand strong{font-size:10px}.brand small{font-size:9px}.logo{width:40px;height:40px;flex-basis:40px}.status{font-size:9px;padding:5px 8px}.welcome{margin-top:25px}.grid{gap:9px}.service{padding:13px;min-height:150px}.panel{padding:14px}}
@media(max-width:360px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"><div class="login"><div class="loader"></div><p class="muted">Connecting securely to Telegram…</p></div></div>

<script>
(function(){
"use strict";

const API="https://data-verification-api.shrestharaj980888.workers.dev";
const LOCAL_PREVIEW_LIMIT=100000;
const app=document.getElementById("app");
const tg=window.Telegram&&Telegram.WebApp?Telegram.WebApp:null;

let token="",user=null,services=[],selectedCode="";

if(tg){
tg.ready();
tg.expand();
if(tg.setHeaderColor)tg.setHeaderColor("#0b1220");
if(tg.setBackgroundColor)tg.setBackgroundColor("#0b1220");
}

function esc(v){
return String(v==null?"":v)
.replace(/&/g,"&amp;").replace(/</g,"&lt;")
.replace(/>/g,"&gt;").replace(/"/g,"&quot;")
.replace(/'/g,"&#39;");
}

function money(cents,currency){
return (Number(cents||0)/100).toFixed(2)+" "+(currency||"USDT");
}

function getBalanceDisplay(u){
if(!u)return "Balance unavailable";
const fields=["wallet_balance_cents","balance_cents","wallet_cents"];
for(const key of fields){
if(u[key]!==undefined&&u[key]!==null&&u[key]!==""){
const value=Number(u[key]);
if(Number.isFinite(value))return (value/100).toFixed(2)+" USDT";
}
}
return "Balance unavailable";
}

function fail(msg){
app.innerHTML='<div class="login"><div class="logo">DV</div><h2>Secure login needed</h2><p class="muted">'+esc(msg)+'</p><button class="btn secondary" id="retry">Try again</button></div>';
document.getElementById("retry").onclick=login;
}

async function apiGet(path){
const r=await fetch(API+path,{
method:"GET",
headers:{"Authorization":"Bearer "+token,"Accept":"application/json"}
});
const d=await r.json();
if(!r.ok||!d.ok)throw new Error(d.error||"Request failed");
return d;
}

async function login(){
if(!tg||!tg.initData){
fail("Open this page inside Telegram using the bot button.");
return;
}
app.innerHTML='<div class="login"><div class="loader"></div><p class="muted">Verifying your Telegram account…</p></div>';
try{
const r=await fetch(API+"/api/auth",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({initData:tg.initData})
});
const d=await r.json();
if(!r.ok||!d.ok){fail(d.error||"Authentication failed.");return;}
token=d.token;
const md=await apiGet("/api/me");
user=md.user||d.user||{};
dashboard();
}catch(e){
token="";
fail("Could not complete secure login. Please try again.");
}
}

async function refreshSession(){
if(!token){login();return;}
try{
const d=await apiGet("/api/me");
user=d.user||user;
dashboard();
}catch(e){
token="";
fail("Your session has expired or could not be refreshed. Please log in again.");
}
}

async function loadOrders(){
const statusBox=document.getElementById("orders-status");
const listBox=document.getElementById("orders-list");
const refreshButton=document.getElementById("orders-refresh");
if(!statusBox||!listBox)return;

statusBox.className="orders-message";
statusBox.textContent="Loading your order history…";
listBox.innerHTML="";
if(refreshButton){refreshButton.disabled=true;refreshButton.textContent="Loading…";}

try{
const data=await apiGet("/api/orders?limit=20&offset=0");
const orders=Array.isArray(data.orders)?data.orders:[];
if(!orders.length){
statusBox.textContent="You don't have any orders yet. Your orders will appear here when you start using the service.";
return;
}
statusBox.textContent="Showing "+orders.length+" recent order"+(orders.length===1?"":"s")+".";
listBox.innerHTML=orders.map(function(order){
const id=esc(order.id||"—");
const resource=esc(order.resource_code||"—");
const quantity=Number(order.quantity||0);
const charge=Number(order.customer_charge_cents||0);
const currency=esc(order.currency||"USDT");
const state=esc(order.status||"Unknown");
const reference=order.result_reference?'<div class="order-result"><b>Result reference:</b> '+esc(order.result_reference)+'</div>':"";
let dateText="Date unavailable";
if(order.created_at){
const parsed=new Date(order.created_at);
dateText=!Number.isNaN(parsed.getTime())?parsed.toLocaleString():String(order.created_at);
}
return '<article class="order-item"><div class="order-top"><div class="order-id">Order #'+id+'</div><span class="order-status">'+state+'</span></div><div class="order-details"><div class="order-detail"><span>Resource</span><b>'+resource+'</b></div><div class="order-detail"><span>Quantity</span><b>'+esc(quantity.toLocaleString())+'</b></div><div class="order-detail"><span>Customer charge</span><b>'+money(charge,currency)+'</b></div><div class="order-detail"><span>Order status</span><b>'+state+'</b></div></div>'+reference+'<div class="order-date">'+esc(dateText)+'</div></article>';
}).join("");
}catch(e){
if(e.message==="unauthorized"){token="";fail("Your secure session has expired. Please open the Mini App again.");return;}
statusBox.className="orders-message error";
statusBox.textContent=e.message||"Could not load order history.";
}finally{
if(refreshButton){refreshButton.disabled=false;refreshButton.textContent="Refresh order history";}
}
}

async function loadServices(){
const box=document.getElementById("services-grid");
const status=document.getElementById("catalogue-status");
if(!box||!status)return;
status.textContent="Loading service catalogue…";
try{
const data=await apiGet("/api/services");
services=Array.isArray(data.services)?data.services:[];
renderServices();
const categoryCount=new Set(services.map(s=>s.category||"Other")).size;
status.textContent=services.length+" services across "+categoryCount+" categories loaded. "+(data.ordering_enabled?"":"Ordering is currently disabled.");
}catch(e){
status.textContent="Could not load services: "+e.message;
box.innerHTML='<div class="panel"><p>Service catalogue could not be loaded. Please refresh the page.</p></div>';
}
}

function serviceState(s){
if(!s.configured)return "Pricing not configured";
if(!s.enabled)return "Configured · Not active";
if(!s.can_order)return "Not available for ordering";
return "Available";
}

function servicePrice(s){
if(s.unit_price_cents==null||!s.pricing_unit_quantity)return "Price unavailable";
return money(s.unit_price_cents,s.currency)+" / "+Number(s.pricing_unit_quantity).toLocaleString();
}

function renderServices(){
const box=document.getElementById("services-grid");
const select=document.getElementById("service-select");
if(!box||!select)return;

const groups={};
services.forEach(function(s){
const category=s.category||"Other Services";
if(!groups[category])groups[category]=[];
groups[category].push(s);
});

let html="";
Object.keys(groups).forEach(function(category){
html+='<div class="category-title">'+esc(category)+'</div>';
groups[category].forEach(function(s){
const chosen=s.resource_code===selectedCode;
const icon=s.input_type==="email"?"✉":"✓";
html+='<article class="service '+(chosen?"selected":"")+'" data-code="'+esc(s.resource_code)+'" tabindex="0" role="button" aria-label="Select '+esc(s.name)+'">'+
'<div class="ico">'+icon+'</div>'+
'<strong>'+esc(s.name)+'</strong>'+
'<p>'+esc(s.description)+'</p>'+
'<span class="tag">'+esc(serviceState(s))+'</span>'+
'<div class="service-status">'+esc(servicePrice(s))+'</div>'+
'<div class="service-status">Minimum: '+(s.minimum_order_quantity!=null?Number(s.minimum_order_quantity).toLocaleString():"Not set")+'</div>'+
'</article>';
});
});

box.innerHTML=html||'<div class="panel"><p>No services are currently listed.</p></div>';

select.innerHTML='<option value="">Choose a service</option>'+services.map(function(s){
return '<option value="'+esc(s.resource_code)+'">'+esc(s.category||"Other")+" — "+esc(s.name)+'</option>';
}).join("");

if(selectedCode&&services.some(s=>s.resource_code===selectedCode)){
select.value=selectedCode;
}else{
selectedCode="";
select.value="";
}

box.querySelectorAll("[data-code]").forEach(function(card){
function choose(){selectService(card.getAttribute("data-code"));}
card.addEventListener("click",choose);
card.addEventListener("keydown",function(e){
if(e.key==="Enter"||e.key===" "){e.preventDefault();choose();}
});
});
updateEstimate();
}

function selectService(code){
selectedCode=code;
const s=services.find(x=>x.resource_code===code);
const select=document.getElementById("service-select");
if(select)select.value=code;
renderServices();

const input=document.getElementById("input-label");
const hint=document.getElementById("input-hint");
const area=document.getElementById("entries");
const file=document.getElementById("file");
const count=document.getElementById("count");
const result=document.getElementById("result");
const quantity=document.getElementById("quantity");

if(!s)return;

if(s.input_type==="email"){
input.textContent="Email addresses";
hint.textContent="Enter one email address per line.";
area.placeholder="customer@example.com\nanother@example.com";
}else{
input.textContent="Phone numbers";
hint.textContent="Use international format with country code, e.g. +9779812345678.";
area.placeholder="+9779812345678\n+14155552671";
}

if(file)file.accept=".txt,.csv,text/plain,text/csv";
if(count)count.textContent="0 / "+LOCAL_PREVIEW_LIMIT.toLocaleString();
if(result)result.classList.remove("show");

const minimum=Number(s.minimum_order_quantity||1);
if(quantity){
quantity.min=String(Math.max(1,minimum));
quantity.value=String(Math.max(1,minimum));
}
updateEstimate();
}

function currentEntries(){
return document.getElementById("entries").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
}

function updateEstimate(){
const s=services.find(x=>x.resource_code===selectedCode);
const quantityBox=document.getElementById("quantity");
const box=document.getElementById("price-estimate");
if(!quantityBox||!box)return;

const quantity=Number(quantityBox.value||0);
if(!s){box.innerHTML="Select a service to view its pricing information.";return;}

if(!s.configured||s.unit_price_cents==null||!s.pricing_unit_quantity){
box.innerHTML="Pricing is not configured for this service yet.";
return;
}

const minimum=Number(s.minimum_order_quantity||0);
if(!Number.isSafeInteger(quantity)||quantity<1){
box.innerHTML="Enter a quantity to calculate an estimate.";
return;
}
if(minimum>0&&quantity<minimum){
box.innerHTML="The minimum quantity for this service is "+minimum.toLocaleString()+".";
return;
}

const total=Math.ceil(Number(s.unit_price_cents)*quantity/Number(s.pricing_unit_quantity));
box.innerHTML='<div class="price-line"><span>Category</span><strong>'+esc(s.category)+'</strong></div>'+
'<div class="price-line"><span>Selected service</span><strong>'+esc(s.name)+'</strong></div>'+
'<div class="price-line"><span>Quantity</span><strong>'+quantity.toLocaleString()+'</strong></div>'+
'<div class="price-line"><span>Minimum quantity</span><strong>'+minimum.toLocaleString()+'</strong></div>'+
'<div class="price-line"><span>Price per pricing unit</span><strong>'+money(s.unit_price_cents,s.currency)+' / '+Number(s.pricing_unit_quantity).toLocaleString()+'</strong></div>'+
'<div class="price-line price-total"><span>Estimated customer price</span><strong>'+money(total,s.currency)+'</strong></div>'+
'<div class="service-status">Estimate only. The server must confirm the final price before any order is accepted.</div>';
}

function dashboard(){
const name=user.first_name||"Customer";
const balanceDisplay=getBalanceDisplay(user);

app.innerHTML='<main class="wrap">'+
'<header class="top"><div class="brand"><div class="logo">DV</div><div><strong>DATA VERIFICATION</strong><small>SECURE CUSTOMER PORTAL</small></div></div><span class="status">● SECURE SESSION</span></header>'+
'<nav class="navlinks" aria-label="Dashboard sections"><a href="#services">Services</a><a href="#prepare">Prepare list</a><a href="#consent-section">Consent</a><a href="#activity">Activity</a><a href="#account">Account</a></nav>'+
'<section class="welcome"><div class="eyebrow">Your secure workspace</div><h1>Welcome, '+esc(name)+'</h1><p>Manage your validation services and orders.</p></section>'+

document.getElementById("service-select").addEventListener("change",function(){selectService(this.value);});
document.getElementById("quantity").addEventListener("input",updateEstimate);
document.getElementById("entries").addEventListener("input",updateCount);
document.getElementById("file").addEventListener("change",handleFile);
document.getElementById("review").addEventListener("click",preview);
document.getElementById("clear").addEventListener("click",clearInput);
document.getElementById("consent").addEventListener("change",function(){
document.getElementById("consentmsg").textContent=this.checked
?"Authorization acknowledgement selected locally; it has not been sent to the server."
:"Please confirm that you are authorized to submit this information.";
});

document.getElementById("orders-refresh").onclick=loadOrders;

loadServices();
loadOrders();
}

function updateCount(){
const box=document.getElementById("entries");
const count=document.getElementById("count");
if(!box||!count)return;
const n=box.value.split(/\r?\n/).filter(x=>x.trim()).length;
count.textContent=n.toLocaleString()+" / "+LOCAL_PREVIEW_LIMIT.toLocaleString();
count.style.color=n>LOCAL_PREVIEW_LIMIT?"var(--danger)":"var(--muted)";
}

async function handleFile(){
const file=document.getElementById("file").files[0];
if(!file)return;
const name=file.name.toLowerCase();
if(!name.endsWith(".txt")&&!name.endsWith(".csv")){
document.getElementById("input-hint").textContent="Please select a TXT or CSV file.";
this.value="";
return;
}
try{
let content=await file.text();
let lines=content.split(/\r?\n/);
if(name.endsWith(".csv")){
lines=lines.map(function(line){
const first=line.split(",")[0]||"";
return first.trim().replace(/^"|"$/g,"");
});
}
const first=lines[0]||"";
if(/^(phone|phone_number|number|email|email_address|address)$/i.test(first.trim()))lines.shift();
document.getElementById("entries").value=lines.join("\n").trim();
document.getElementById("input-hint").textContent="Loaded: "+file.name+" · CSV reads the first column.";
updateCount();
document.getElementById("result").classList.remove("show");
}catch(e){
document.getElementById("input-hint").textContent="Could not read this file. Please try again.";
}
}

function clearInput(){
document.getElementById("entries").value="";
document.getElementById("file").value="";
document.getElementById("input-hint").textContent="One entry per line · local preview limit: "+LOCAL_PREVIEW_LIMIT.toLocaleString()+".";
document.getElementById("result").classList.remove("show");
updateCount();
}

function preview(){
const s=services.find(x=>x.resource_code===selectedCode);
const out=document.getElementById("result");
const lines=currentEntries();
out.classList.add("show");

if(!s){out.textContent="Please select a service first.";return;}
if(!lines.length){out.textContent="Add at least one entry to review your list.";return;}
if(lines.length>LOCAL_PREVIEW_LIMIT){
out.textContent="Your list contains "+lines.length.toLocaleString()+" entries. The local preview limit is "+LOCAL_PREVIEW_LIMIT.toLocaleString()+".";
return;
}

const quantity=Number(document.getElementById("quantity").value||0);
const minimum=Number(s.minimum_order_quantity||0);
if(minimum>0&&quantity<minimum){
out.textContent="The selected quantity is below this service's minimum of "+minimum.toLocaleString()+".";
return;
}

const seen=new Set(),duplicates=new Set();
for(const item of lines){if(seen.has(item))duplicates.add(item);seen.add(item);}
const duplicateCount=lines.filter(x=>duplicates.has(x)).length;

let valid=0;
if(s.input_type==="email"){
valid=lines.filter(x=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x)).length;
}else{
valid=lines.filter(x=>/^\+[1-9]\d{6,14}$/.test(x)).length;
}
const invalid=lines.length-valid;
const type=s.input_type==="email"?"basic email syntax":"international phone-number format";

out.innerHTML="<b>Local review complete</b><div class=\"result-grid\"><div class=\"result-stat\"><b>"+lines.length.toLocaleString()+"</b><span>Total entries</span></div><div class=\"result-stat\"><b>"+valid.toLocaleString()+"</b><span>Format looks valid</span></div><div class=\"result-stat\"><b>"+invalid.toLocaleString()+"</b><span>Needs review</span></div></div><p style=\"margin-top:9px;color:#b7cbd7\">Possible repeated entries: <b>"+duplicateCount.toLocaleString()+"</b>. This checks only "+type+". It does not confirm deliverability, ownership, or carrier details. Nothing was uploaded.</p>";
updateEstimate();
}

login();
})();
</script>
