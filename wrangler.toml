name = "data-verification-api"
main = "worker.js"
compatibility_date = "2026-11-20"

[triggers]
crons = ["*/2 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "data-verification-test"
database_id = "ee708fbc-1638-4169-8044-2930c37945ec"

[[previews.d1_databases]]
binding = "DB"
database_id = "0891dea4-f0e8-4831-ace4-51399ad7a347"

# Durable, non-secret defaults for the production Worker.
# Keep these values in version control so deployments can restore them.
[vars]
CN_BASE_URL = "https://api.checknumber.ai"
ZELNUM_BASE_URL = "https://api.zelnum.com/api/v1"
TELEGRAM_STORAGE_CHAT_ID = "-1003768905030"

# Preserve dashboard-only variables during Wrangler deployments.
keep_vars = true
